<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Level Auto Body — Job Tracker</title>
<style>
.owner-only{display:none !important;}
body.is-owner .owner-only{display:inline-block !important;}
body.is-owner #deleteJobBtn.owner-only{display:none !important;}
body.is-owner.form-editing #deleteJobBtn.owner-only{display:block !important;}
.x-row{display:grid;grid-template-columns:minmax(0,1fr) 56px 88px 34px;gap:6px;margin-bottom:6px;align-items:center;}
.x-row input{font-size:.86rem;padding:7px;}
.x-row button{background:transparent;color:#dc2626;border:1px solid #dc2626;padding:6px;font-size:.8rem;border-radius:6px;}
.qty-step{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:7px;overflow:hidden;background:var(--bg);}
.qty-step button{background:var(--card);border:none;border-radius:0;padding:0 12px;font-size:1.1rem;font-weight:700;color:var(--text);}
.qty-step input{border:none;border-radius:0;text-align:center;font-weight:700;min-width:0;}
@media(max-width:640px){ #oilBtn{padding:6px 9px;} }
#alertStack{position:fixed;top:12px;right:12px;z-index:500;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 24px));pointer-events:none;}
.alert-card{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;background:#dc2626;color:#fff;border-radius:14px;padding:11px 12px;
  box-shadow:0 10px 30px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.2);cursor:pointer;animation:alertIn .28s cubic-bezier(.2,.9,.3,1.2);transition:opacity .22s,transform .22s;}
.alert-card.out{opacity:0;transform:translateX(30px);}
.alert-ic{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.alert-body{flex:1;min-width:0;}
.alert-top{display:flex;justify-content:space-between;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;opacity:.9;}
.alert-time{font-weight:600;text-transform:none;letter-spacing:0;}
.alert-msg{font-size:.9rem;font-weight:600;margin-top:2px;line-height:1.3;}
.alert-x{background:transparent;border:none;color:#fff;opacity:.8;padding:2px 4px;font-size:.85rem;}
.alert-x:hover{opacity:1;}
@keyframes alertIn{from{opacity:0;transform:translateY(-14px) scale(.96);}to{opacity:1;transform:none;}}
.iv-num{font-size:15px;font-weight:800;color:var(--accent);margin:-4px 0 10px;letter-spacing:.02em;}
.iv-numrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.iv-numrow label{font-size:.7rem;color:#666;margin:0;text-transform:none;}
.iv-numrow input{display:block;margin-top:3px;width:120px;background:#fff;color:#222;border-color:#d5d8dc;padding:6px 8px;font-size:.95rem;font-weight:700;}
#iv-numMsg{font-size:.78rem;padding-bottom:7px;}
.inv-badge{display:inline-block;font-size:.62rem;font-weight:800;color:var(--accent);background:rgba(234,110,30,.1);border:1px solid rgba(234,110,30,.35);border-radius:4px;padding:0 5px;margin-right:5px;vertical-align:2px;letter-spacing:.02em;}
h3 .inv-badge{margin:0 0 0 6px;font-size:.7rem;}

.doc-bar{position:sticky;top:-20px;z-index:5;display:flex;gap:8px;margin:-32px -32px 18px;padding:12px 16px;background:#fff;border-bottom:1px solid #e6e7ea;border-radius:10px 10px 0 0;}
.doc-print{flex:1;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px;font-size:.95rem;font-weight:700;}
.doc-pdf{flex:1;background:#fff;color:var(--accent);border:1.5px solid var(--accent);border-radius:8px;padding:11px;font-size:.95rem;font-weight:700;}
.doc-close{background:#fff;color:#444;border:1px solid #d5d8dc;border-radius:8px;padding:11px 18px;font-size:.9rem;font-weight:600;}
.doc-hint{font-size:.8rem;color:#555;text-align:center;margin:-8px 0 12px;}
.doc-hint:empty{display:none;}
@media (min-width:1000px){ .doc-bar{top:-18px;margin:-22px -22px 18px;} }

.iv{color:#222;font-size:12px;line-height:1.35;}
.iv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:22px;border-bottom:1px solid #ddd;}
.iv-logo{width:150px;max-width:38%;margin-top:40px;}
.iv-shop{text-align:right;font-size:11px;}
.iv-title{font-size:32px;font-weight:400;letter-spacing:.01em;line-height:1;margin-bottom:10px;}
.iv-sn{font-weight:700;}
.iv-mid{display:flex;justify-content:space-between;gap:16px;padding:22px 0 26px;flex-wrap:wrap;}
.iv-bill{font-size:11px;}
.iv-bt{font-weight:700;color:#5b6670;font-size:13px;margin-bottom:4px;}
.iv-bn{font-weight:700;}
.iv-meta{border-collapse:collapse;font-size:11px;}
.iv-meta th{text-align:right;font-weight:700;padding:3px 12px 3px 0;white-space:nowrap;}
.iv-meta td{padding:3px 12px 3px 0;white-space:nowrap;}
.iv-meta .iv-due th,.iv-meta .iv-due td{background:#f2f3f4;padding-top:7px;padding-bottom:7px;}
.iv-meta .iv-due th{padding-left:14px;}
.iv-meta .iv-due td{font-weight:700;}
.iv-tbl{width:100%;border-collapse:collapse;font-size:11px;border-bottom:2px solid #cfd8e0;}
.iv-tbl thead th{background:#444;color:#fff;font-weight:700;font-size:13px;padding:11px 22px;}
.iv-tbl td{padding:11px 22px 9px;vertical-align:top;}
.iv-it{text-align:left;width:52%;}
.iv-q{text-align:center;}
.iv-r{text-align:right;white-space:nowrap;}
.iv-nm{font-weight:700;}
.iv-ds{color:#555;font-size:11.5px;margin-top:2px;}
.iv-warn{color:#dc2626;font-weight:700;font-size:10px;margin-top:3px;}
.iv-tot{margin:16px 22px 0 auto;border-collapse:collapse;font-size:11px;min-width:240px;}
.iv-tot th{text-align:right;font-weight:700;padding:4px 40px 4px 0;}
.iv-tot td{text-align:right;padding:4px 0;white-space:nowrap;}
.iv-tot .iv-sep th,.iv-tot .iv-sep td{border-top:1px solid #ddd;padding-top:12px;}
.iv-tot .iv-dbl th,.iv-tot .iv-dbl td{border-top:3px solid #cfd8e0;padding-top:12px;font-weight:700;}
.iv-note{margin-top:14px;font-size:11px;color:#555;}
.iv-thanks{margin-top:26px;text-align:center;color:#888;font-size:11px;}
.iv-ctl{margin-top:22px;background:#f6f7f8;border:1px solid #e3e5e8;border-radius:10px;padding:12px;color:#222;}
.iv-ctl-h{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#666;margin-bottom:6px;}
.iv-ctl-h span{font-weight:500;text-transform:none;letter-spacing:0;}
.iv-taxchk{display:flex;align-items:center;gap:7px;font-size:.85rem;color:#222;text-transform:none;letter-spacing:0;font-weight:600;margin:0 0 10px;cursor:pointer;}
.iv-taxchk input{width:auto;margin:0;accent-color:var(--accent);}
.iv-dates{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
.iv-dates label{font-size:.7rem;color:#666;margin:0;text-transform:none;}
.iv-dates input{background:#fff;color:#222;border-color:#d5d8dc;padding:6px 8px;font-size:.85rem;width:auto;display:block;margin-top:3px;}
.iv-dates button{padding:7px 10px;font-size:.78rem;color:#444;border-color:#d5d8dc;background:#fff;}
.iv-xrow{display:grid;grid-template-columns:1.3fr 1.5fr 60px 80px 30px;gap:5px;margin-bottom:5px;}
.iv-xrow input{background:#fff;color:#222;border-color:#d5d8dc;padding:6px 7px;font-size:.82rem;}
.iv-xrow button{background:#fff;color:#dc2626;border:1px solid #f0b4b4;padding:0;font-size:.8rem;}
.iv-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.iv-chips button{background:#fff;border:1px solid #d5d8dc;color:#333;padding:5px 9px;font-size:.74rem;border-radius:14px;font-weight:600;}
.iv-chips button:hover{border-color:var(--accent);color:var(--accent);opacity:1;}
@media(max-width:640px){
  .iv-xrow{grid-template-columns:1fr 1fr;}
  .iv-xrow input[data-xf="desc"]{grid-column:1/-1;order:3;}
  .iv-tbl thead th,.iv-tbl td{padding-left:8px;padding-right:8px;}
  .iv-tot{margin-right:8px;}
  .iv-title{font-size:26px;}
  .iv-logo{margin-top:6px;}
}
:root{
  --bg:#f1f3f6; --card:#ffffff; --text:#161a20; --muted:#667085; --border:#e3e6ea;
  --navy:#000000; --navy2:#1a1a1a; --accent:#f5711f; --accent-text:#fff;
  --received:#8b93a1; --diagnosing:#d97706; --awaitingApproval:#eab308; --waitingParts:#a855f7; --repair:#2563eb; --ready:#16a34a; --done:#4b5563;
  --shadow:0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f13; --card:#181b21; --text:#eceef1; --muted:#8f97a3; --border:#2a2e37;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f13; --card:#181b21; --text:#eceef1; --muted:#8f97a3; --border:#2a2e37;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased;}
.topbar{background:#0b0b0c;padding:7px 20px;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:40;}
.topbar-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;}
.topbar img{height:28px;display:block;flex-shrink:0;}
.tb-search{flex:1;max-width:560px;margin-left:14px;position:relative;}
.tb-search input{background:#1b1c1f;border:1px solid #2e3035;color:#f1f2f4;padding:7px 11px 7px 32px;font-size:.86rem;border-radius:7px;}
.tb-search input::placeholder{color:#8a8f98;}
.tb-search input:focus{outline:none;border-color:var(--accent);background:#222327;}
.tb-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:#8a8f98;pointer-events:none;}
.tb-actions{display:flex;gap:6px;margin-left:auto;align-items:center;}
.tb-new{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:.84rem;font-weight:700;white-space:nowrap;}
.tb-quick{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:7px;padding:6px 12px;font-size:.84rem;font-weight:700;white-space:nowrap;}
.tb-quick:hover{background:rgba(234,110,30,.12);opacity:1;}
.wrap{max-width:960px;margin:0 auto;padding:10px 20px 40px;}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.stats{display:flex;flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);}
.stat{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:none;border-left:1px solid var(--border);
  border-radius:0;padding:7px 4px;cursor:pointer;font-family:inherit;color:var(--text);white-space:nowrap;
  transition:background .12s;-webkit-tap-highlight-color:transparent;}
.stat:first-child{border-left:none;}
.stat:hover{background:var(--bg);opacity:1;}
.stat .l{order:0;font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.stat .n{order:1;font-size:.8rem;font-weight:800;min-width:20px;padding:1px 6px;border-radius:10px;background:var(--bg);line-height:1.3;}
.stat.zero .n{color:var(--muted);opacity:.55;background:transparent;}
.stat.zero .l{opacity:.6;}
.stat.active{background:var(--accent);}
.stat.active .l{color:#fff;opacity:1;}
.stat.active .n{background:rgba(255,255,255,.25);color:#fff;opacity:1;}
.tools{display:flex;gap:4px;flex-shrink:0;}
.tools button{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--card);
  border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);font-size:1rem;line-height:1;}
.tools button:hover{border-color:var(--accent);opacity:1;}
.tools button.on{border-color:var(--accent);background:rgba(234,110,30,.1);}
.fab{display:none;}
@media(max-width:640px){
  .topbar{padding:7px 12px;}
  .topbar-inner{flex-wrap:wrap;gap:7px;}
  .tb-search{order:3;flex:1 1 100%;max-width:none;margin-left:0;}
  .tb-new{display:none !important;}
  .toolbar{flex-direction:column;align-items:stretch;gap:7px;}
  .stats{overflow-x:auto;scrollbar-width:none;}
  .stats::-webkit-scrollbar{display:none;}
  .stat{flex:0 0 auto;padding:8px 10px;}
  .tools{justify-content:space-between;}
  .tools button{flex:1;height:36px;}
  .fab{display:flex;position:fixed;right:18px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:1.9rem;font-weight:400;line-height:1;align-items:center;justify-content:center;border:none;padding:0;z-index:45;
    box-shadow:0 6px 18px rgba(234,110,30,.45),0 2px 5px rgba(0,0,0,.25);}
  body.form-open .fab{display:none;}
}

.sched{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;box-shadow:var(--shadow);margin-bottom:10px;padding:2px 0;}
.sched-row{display:flex;align-items:center;gap:10px;padding:5px 12px;font-size:.8rem;cursor:pointer;border-top:1px solid var(--border);min-width:0;}
.sched-row:first-child{border-top:none;}
.sched-row:hover{background:var(--bg);}
.sched-day{width:78px;flex-shrink:0;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;}
.sched-day.soon{color:var(--accent);}
.sched-time{width:62px;flex-shrink:0;font-weight:800;white-space:nowrap;}
.sched-time.none{font-weight:500;color:var(--muted);}
.sched-car{font-weight:700;white-space:nowrap;}
.sched-car.none{font-weight:500;font-style:italic;color:var(--muted);}
.sched-rest{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
@media(max-width:640px){ .sched-day{width:54px;} .sched-time{width:56px;} }
.p-grip{cursor:grab;touch-action:none;user-select:none;color:var(--muted);font-size:1.15rem;line-height:1;padding:6px 3px;border-radius:5px;}
.p-grip:hover{color:var(--accent);background:var(--bg);}
.p-mv{background:transparent;border:1px solid var(--border);color:var(--muted);width:30px;height:34px;padding:0;font-size:.7rem;border-radius:6px;flex-shrink:0;}
.p-mv:hover{border-color:var(--accent);color:var(--accent);opacity:1;}
.p-mv:disabled{opacity:.25;pointer-events:none;}
[data-prow]{transition:box-shadow .12s;}
.p-dragging{position:relative;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.18);opacity:.95;transition:none;}
.p-drop{outline:2px dashed var(--accent);outline-offset:2px;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
.fee-chk{display:flex;align-items:center;gap:8px;margin:2px 0 0 !important;padding:9px 11px;border:1px dashed var(--border);border-radius:8px;cursor:pointer;
  text-transform:none !important;letter-spacing:0 !important;font-size:.86rem !important;font-weight:600 !important;color:var(--text) !important;}
.fee-chk input{width:17px;height:17px;margin:0;accent-color:var(--accent);}
.fee-chk .fee-amt{margin-left:auto;color:var(--muted);font-weight:700;}
.pay-full{background:var(--card);border:1.5px solid var(--accent);color:var(--accent);border-radius:8px;padding:0 12px;font-size:.82rem;font-weight:700;white-space:nowrap;}
.pay-full:hover{background:rgba(234,110,30,.09);opacity:1;}
.split-box{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px;}
.split-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.split-grid label{text-transform:none;letter-spacing:0;font-size:.8rem;font-weight:700;color:var(--text);margin:0;}
.split-grid input{margin-top:4px;font-size:1rem;font-weight:700;background:var(--card);}
.split-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap;}
.split-foot .pay-full{padding:7px 12px;}
#splitInfo{font-size:.8rem;font-weight:600;color:var(--muted);}
.pay-row{display:flex;gap:8px;flex-wrap:wrap;}
.pay-chk{flex:1;display:flex !important;align-items:center;justify-content:center;gap:8px;margin:0 !important;padding:11px 8px;border:1.5px solid var(--border);border-radius:9px;background:var(--card);cursor:pointer;
  text-transform:none !important;letter-spacing:0 !important;font-size:.95rem !important;font-weight:700 !important;color:var(--text) !important;transition:border-color .12s,background .12s;}
.pay-chk input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex-shrink:0;}
.pay-chk:has(input:checked){border-color:var(--accent);background:rgba(234,110,30,.09);}
.mm-wrap{position:relative;}
.mm-list{position:absolute;left:0;min-width:100%;width:max-content;max-width:min(360px,92vw);top:100%;margin-top:3px;background:var(--card);border:1px solid var(--border);border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.18);z-index:30;overflow:hidden;max-height:300px;overflow-y:auto;}
.pt-list{position:fixed !important;top:0;left:0;z-index:200;}
.mm-opt{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:.9rem;cursor:pointer;border-top:1px solid var(--border);}
.mm-opt:first-child{border-top:none;}
.mm-opt:hover,.mm-opt.on{background:rgba(234,110,30,.1);}
.mm-opt b{color:var(--accent);font-weight:800;}
.mm-lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mm-tag{margin-left:auto;flex-shrink:0;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
.board{display:grid;grid-template-columns:repeat(6,minmax(168px,1fr));gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;align-items:start;}
.bcol{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:7px;min-height:140px;transition:outline-color .1s;}
.bcol.drop{outline:2px dashed var(--accent);outline-offset:-2px;background:rgba(234,110,30,.06);}
.bcol-h{display:flex;align-items:center;gap:6px;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:2px 3px 7px;}
.bcol-h .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.bcol-h .cnt{margin-left:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0 7px;font-size:.66rem;color:var(--text);}
.bcol-empty{font-size:.74rem;color:var(--muted);text-align:center;padding:18px 0;opacity:.6;}
.tile{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--received);border-radius:8px;padding:8px 9px 7px;margin-bottom:6px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,box-shadow .12s;}
.tile:hover{box-shadow:0 3px 10px rgba(0,0,0,.12);}
.tile:active{transform:scale(.98);}
.tile.dragging{opacity:.4;}
.tile.editing{outline:2px solid var(--accent);}
.tile-mm{font-weight:800;font-size:.9rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.tile-pl{font-size:.76rem;font-weight:700;letter-spacing:.04em;margin-top:2px;}
.tile-pl span{font-weight:500;letter-spacing:0;color:var(--muted);}
.tile-is{font-size:.76rem;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile-ft{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:6px;font-size:.74rem;}
.tile-amt{font-weight:800;}
.pay{font-size:.6rem;font-weight:800;text-transform:uppercase;border-radius:4px;padding:1px 5px;color:#fff;margin-left:4px;vertical-align:1px;}
.tile-flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}
.tile-flags span{font-size:.6rem;font-weight:800;text-transform:uppercase;border-radius:4px;padding:1px 5px;}
.tile-act{display:flex;gap:4px;margin-top:7px;border-top:1px solid var(--border);padding-top:6px;}
.tile-act button{flex:1;background:transparent;border:1px solid var(--border);color:var(--text);padding:4px 0;font-size:.74rem;border-radius:5px;line-height:1;}
.tile-act button:hover{border-color:var(--accent);color:var(--accent);opacity:1;}
.tile-act button:disabled{opacity:.25;pointer-events:none;}
@media(max-width:640px){
  .board{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78vw;scroll-snap-type:x mandatory;margin:0 -20px 14px;padding:0 20px 8px;}
  .bcol{scroll-snap-align:start;}
}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow);}
.card-title{font-weight:700;margin-bottom:14px;font-size:.98rem;display:flex;align-items:center;justify-content:space-between;}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
form .full{grid-column:1/-1}
label{font-size:.74rem;color:var(--muted);display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:.92rem;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
textarea{resize:vertical;min-height:50px}
button{cursor:pointer;border:none;border-radius:7px;padding:10px 18px;font-size:.9rem;font-weight:600;font-family:inherit;transition:opacity .15s;}
button:hover{opacity:.88}
.btn-primary{background:var(--accent);color:var(--accent-text);grid-column:1/-1;}
.btn-danger{background:transparent;color:#dc2626;border:1px solid #dc2626;padding:6px 12px;font-size:.78rem;}
.btn-edit{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px 12px;font-size:.78rem;}
.btn-cancel{background:transparent;color:var(--muted);border:1px solid var(--border);padding:10px 18px;font-size:.9rem;}
.btn-export{background:var(--card);color:var(--text);border:1px solid var(--border);padding:7px 6px;font-size:.78rem;font-weight:600;box-shadow:var(--shadow);}

.truck{border:1px solid var(--border);border-radius:10px;padding:15px 16px;margin-bottom:11px;background:var(--card);box-shadow:var(--shadow);}
.truck[data-job]{cursor:pointer;transition:border-color .12s,box-shadow .12s;}
.truck[data-job]:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(245,113,31,.18);}
.truck[data-job].editing{border-color:var(--accent);border-width:2px;padding:14px 15px;}
.truck-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.truck h3{margin:0 0 3px;font-size:1.05rem;font-weight:700;}
.meta{color:var(--muted);font-size:.82rem;line-height:1.5;}
.badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:.72rem;font-weight:700;color:#fff;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;}
.status-received{background:var(--received)}
.status-diagnosing{background:var(--diagnosing)}
.status-awaitingApproval{background:var(--awaitingApproval)}
.status-waitingParts{background:var(--waitingParts)}
.status-repair{background:var(--repair)}
.status-ready{background:var(--ready)}
.status-done{background:var(--done)}
.tag{display:inline-block;padding:3px 9px;border-radius:5px;font-size:.7rem;font-weight:700;border:1px solid var(--border);color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.03em;}
.tag-Insurance{color:#7c3aed;border-color:#7c3aed;background:rgba(124,58,237,.08);}
.tag-Warranty{color:#0891b2;border-color:#0891b2;background:rgba(8,145,178,.08);}
.tag-Mechanical{color:var(--muted);}
.notes{margin-top:9px;font-size:.86rem;white-space:pre-wrap;color:var(--text);opacity:.85;border-top:1px solid var(--border);padding-top:9px;}
.controls{margin-top:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.empty{color:var(--muted);text-align:center;padding:36px 0;font-size:.9rem;}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.filters button{background:var(--card);color:var(--text);border:1px solid var(--border);font-weight:600;font-size:.82rem;padding:7px 13px;box-shadow:var(--shadow);}
.filters button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.sect{grid-column:1/-1;margin-top:4px;}
.sect-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:11px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-weight:700;font-size:.85rem;}
.sect-body{display:none;grid-template-columns:1fr 1fr;gap:12px;padding:12px 2px 2px;}
.sect.open .sect-body{display:grid;}
.sect.open .sect-head{border-bottom-left-radius:0;border-bottom-right-radius:0;}
.sect-body .full{grid-column:1/-1;}
body.readonly .edit-only{display:none !important;}
.ro-badge{display:none;margin-left:auto;background:rgba(255,255,255,.15);color:#fff;
  border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 13px;
  font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
body.readonly .ro-badge{display:inline-block;}

#invoiceOverlay,#panelOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);}

@media (min-width:1000px){
  .wrap{max-width:1500px;}
  .topbar-inner{max-width:1460px;}

  body.form-open .wrap{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:20px;align-items:start;}
  body.form-open .wrap > *{grid-column:1;}
  body.form-open .wrap > #formCard{
    grid-column:2;grid-row:1 / span 40;position:sticky;top:16px;
    max-height:calc(100vh - 32px);overflow-y:auto;margin-bottom:0;}

  #invoiceOverlay, #panelOverlay{
    left:auto;right:0;top:0;bottom:0;width:560px;
    background:var(--card);border-left:1px solid var(--border);
    box-shadow:-8px 0 26px rgba(0,0,0,.18);padding:18px;}
  #invoiceSheet, #panelSheet{max-width:100%;margin:0;border-radius:0;}
  #invoiceSheet{padding:22px;}
  body.doc-open .wrap{margin-right:580px;max-width:none;}
  body.doc-open .topbar-inner{max-width:none;margin-right:580px;}
}
@media (min-width:1000px) and (max-width:1300px){
  body.form-open .wrap{grid-template-columns:minmax(0,1fr) 380px;}
  #invoiceOverlay, #panelOverlay{width:460px;}
  body.doc-open .wrap{margin-right:480px;}
  body.doc-open .topbar-inner{margin-right:480px;}
}
@media (max-width:640px){
  form{grid-template-columns:1fr;}
}
</style>
</head>

<script>
const LABOR_RATE = 95;
const DEFAULT_STATE = "NY";

let shopInfo = {name:"High Level Auto Body", address:"47 Coopers Corner Rd, Monticello, NY 12701",
                phone:"845 707 9977", license:"", email:"highlevelnyc@gmail.com"};

function loadShopInfo(){
  try{
    const raw = localStorage.getItem("shopInfo");
    if(raw){
      const saved = JSON.parse(raw);
      Object.keys(saved).forEach(k=>{ if(saved[k] === "" || saved[k] == null) delete saved[k]; });
      shopInfo = {...shopInfo, ...saved};
    }
  }catch(e){}
}
function saveShopInfo(){
  try{ localStorage.setItem("shopInfo", JSON.stringify(shopInfo)); }catch(e){}
}
loadShopInfo();

const STATUSES = [
  {id:"received", label:"Received"},
  {id:"diagnosing", label:"Diagnosing"},
  {id:"awaitingApproval", label:"Awaiting Approval"},
  {id:"waitingParts", label:"Waiting for Parts"},
  {id:"repair", label:"In Repair"},
  {id:"ready", label:"Ready"},
  {id:"done", label:"Completed"}
];

let db = null;
let downloads = null;
let trucks = [];
let filter = "all";
let searchQuery = "";
let editingId = null;

function fmtDate(ts){
  try{ return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }catch(e){ return ""; }
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function priceLine(t){
  if(!Number(t.estimate)) return "";
  return ` · Parts $${Number(t.estimate).toFixed(2)}`;
}

function towLine(t){
  if(!t.towed) return "";
  const cost = t.towCost ? ` ($${Number(t.towCost).toFixed(2)})` : "";
  if(!t.pickupLocation) return ` · Towed${cost}`;
  const mi = t.towMiles
    ? (t.milesEstimated
        ? ` · <span style="color:#dc2626;font-weight:700;">${Number(t.towMiles)} mi UNVERIFIED</span>`
        : ` · ${Number(t.towMiles)} mi`)
    : "";
  return ` · Towed${cost} · ${escapeHtml(t.pickupLocation)} → shop${mi}`;
}

function approvedWork(t){ return (t.workList||[]).filter(w=>w.status === "approved"); }
function hasWorkItems(t){ return !!(t.workList && t.workList.length); }
function jobDiagFee(t){
  if(!t.diagCharge || t.diagWaived || !t.diagFee) return 0;
  return Number(t.diagFee) || 0;
}
function jobSubtotal(t){
  let parts, labor;
  if(hasWorkItems(t)){
    const ap = approvedWork(t);
    parts = ap.reduce((n,w)=>n+(parseFloat(w.parts)||0),0);
    labor = ap.reduce((n,w)=>n+(parseFloat(w.hours)||0),0) * LABOR_RATE;
  } else {
    parts = Array.isArray(t.partsList) && (t.partsList.length || t.partsSaved) ? partsListTotal(t.partsList)
          : (t.partsSaved ? 0 : (t.estimate ? Number(t.estimate) : 0));
    labor = t.laborHours ? Number(t.laborHours) * LABOR_RATE : 0;
  }
  const tow = (t.towed && t.towCost) ? Number(t.towCost) : 0;
  const quick = t.quickAmount ? Number(t.quickAmount) : 0;
  return parts + labor + tow + jobDiagFee(t) + quick + extrasTotal(t);
}
function extrasTotal(t){
  return (t.extraItems||[]).reduce((n,x)=> n + (parseFloat(x.qty)||0) * (parseFloat(x.price)||0), 0);
}
function payMethodText(t){
  if(t.paidCash || t.paidCard){
    const c = Number(t.paidCash)||0, d = Number(t.paidCard)||0;
    return `Cash $${c.toFixed(2)} \u00b7 Card $${d.toFixed(2)}`;
  }
  return t.paymentMethod || "";
}
function taxRate(t){ return (t && t.noTax) ? 0 : 0.08; }
function jobTax(t){ return jobSubtotal(t) * taxRate(t); }
function jobPaid(t){ return t.paid ? Number(t.paid) : 0; }
function jobBalance(t){ return jobTotal(t) - jobPaid(t); }
function paymentBadge(t){
  const total = jobTotal(t);
  if(total <= 0) return "";
  const bal = jobBalance(t);
  if(t.paymentStatus === "paid" || bal <= 0.005)
    return `<span class="badge" style="background:var(--ready);margin-left:6px;">Paid${t.paymentMethod?" \u00b7 "+escapeHtml(t.paymentMethod):""}</span>`;
  if(jobPaid(t) > 0)
    return `<span class="badge" style="background:#d97706;margin-left:6px;">Bal $${bal.toFixed(2)}</span>`;
  return `<span class="badge" style="background:#dc2626;margin-left:6px;">Unpaid</span>`;
}
const CARD_FEE = 0.04;
function jobBaseTotal(t){ return jobSubtotal(t) * (1 + taxRate(t)); }
function cardFeeAmt(t){
  if(!t || !t.cardFee) return 0;
  if(t.paidCash || t.paidCard) return (Number(t.paidCard)||0) * CARD_FEE / (1 + CARD_FEE);
  if(/card/i.test(t.paymentMethod||"")) return jobBaseTotal(t) * CARD_FEE;
  return 0;
}
function jobTotal(t){ return jobBaseTotal(t) + cardFeeAmt(t); }

function startEdit(id){
    const t = trucks.find(x=>x.id===id);
    if(!t) return;
    editingId = id;
    document.querySelectorAll(".truck[data-job]").forEach(c=>
      c.classList.toggle("editing", c.getAttribute("data-job") === id));
    document.getElementById("f-vehicle").value = t.vehicle || "";
    document.getElementById("f-plateState").value = t.plateState || DEFAULT_STATE;
    document.getElementById("f-makeModel").value = t.makeModel || "";
    document.getElementById("f-vin").value = jobVin(t) || "";
    document.getElementById("f-chargeTax").checked = !t.noTax;
    formExtras = (t.extraItems||[]).map(x=>({...x}));
    renderXRows();
    setPhotoPreview(t.photo || null);
    galleryPhotos = (t.gallery || []).slice();
    renderGallery();
    document.getElementById("f-customer").value = t.customer || "";
    document.getElementById("f-phone").value = fmtPhoneDash(t.phone || "");
    document.getElementById("f-issue").value = t.issue || "";
    document.getElementById("f-estimate").value = t.estimate || "";
    document.getElementById("f-partsCost").value = t.partsCost || "";
    updateMarginPreview();
    document.getElementById("f-complaint").value = t.complaint || "";
    document.getElementById("f-warrantyMonths").value = t.warrantyMonths || "";
    document.getElementById("f-scheduled").value = t.scheduled || "";
    document.getElementById("f-scheduledTime").value = t.scheduledTime || "";
    renderTimeChips();
    document.getElementById("f-hasDiag").checked = !!t.diagCharge;
    document.getElementById("f-diagFee").value = t.diagFee || "";
    document.getElementById("f-diagWaived").checked = !!t.diagWaived;
    applyDiagState();
    document.getElementById("f-itemizeWork").checked = !!t.itemizeWork;
    document.getElementById("workListWrap").style.display = t.itemizeWork ? "block" : "none";
    workList = (t.workList || []).map(w=>({...w}));
    renderWorkRows();

    partsList = (t.partsList || []).map(p=>({...p}));
    ensurePartRow();
    document.getElementById("f-laborHours").value = t.laborHours || "";
    document.getElementById("f-jobType").value = t.jobType || "Mechanical";
    document.getElementById("f-towed").checked = !!t.towed;
    applyTowState();
    document.getElementById("f-towCost").value = t.towCost || "";
    document.getElementById("f-pickupLocation").value = t.pickupLocation || "";
    document.getElementById("f-towMiles").value = t.towMiles || "";
    milesEstimated = !!t.milesEstimated;
    applyMilesFlag();
    refreshMapLink();
    refreshRouteLine();
    document.getElementById("f-paid").value = t.paid || "";
    document.getElementById("f-paymentMethod").value = t.paymentMethod || "";
    {
      const pm = t.paymentMethod || "";
      const isSplit = !!(t.paidCash || t.paidCard) || (/cash/i.test(pm) && /card/i.test(pm));
      document.getElementById("f-paySplit").checked = isSplit;
      document.getElementById("f-payCash").checked = !isSplit && /cash/i.test(pm);
      document.getElementById("f-payCard").checked = !isSplit && /card/i.test(pm);
      document.getElementById("f-payCashAmt").value = isSplit ? (t.paidCash || (t.paidCard ? "" : (t.paid || ""))) : "";

    }

      !!(t.complaint || t.diagCharge || t.scheduled || t.scheduledTime || t.warrantyMonths);

      !!(t.paid || t.paymentMethod || (t.paymentStatus && t.paymentStatus !== "unpaid"))
    ];
    sects.forEach((sec,i)=>{
      sec.classList.toggle("open", !!hasData[i]);
      sec.querySelector(".chev").innerHTML = hasData[i] ? "&#9662;" : "&#9656;";
    });
    updateGrandTotal();

    if(!isWide()) window.scrollTo({top:0, behavior:"smooth"});
}

function renderSearchSummary(){
  const el = document.getElementById("searchSummary");
  if(!el) return;
  if(!searchQuery){ el.innerHTML = ""; return; }

  const q = searchQuery.toLowerCase();
  const hits = trucks.filter(t=>!t.deleted && (
       (t.vehicle||"").toLowerCase().includes(q)
    || (t.customer||"").toLowerCase().includes(q)
    || (t.phone||"").toLowerCase().includes(q)
    || (t.makeModel||"").toLowerCase().includes(q)
    || (t.issue||"").toLowerCase().includes(q)
    || invMatch(t, q)));

  if(hits.length === 0){ el.innerHTML = ""; return; }

  // group by the vehicle itself, newest job wins for the details
  const byVeh = {};
  hits.forEach(t=>{
    const k = normVeh(t.vehicle);
    if(!k) return;
    if(!byVeh[k]) byVeh[k] = [];
    byVeh[k].push(t);
  });

  const keys = Object.keys(byVeh);
  if(keys.length === 0){ el.innerHTML = ""; return; }

  const cards = keys.slice(0,4).map(k=>{
    const all = trucks.filter(t=>!t.deleted && normVeh(t.vehicle) === k)
                      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const latest = all[0];
    const spent = all.reduce((n,t)=>n+jobTotal(t),0);
    const owed  = all.filter(t=>!t.archived).reduce((n,t)=>n+Math.max(0,jobBalance(t)),0);
    const miles = all.map(t=>t.mileage).filter(Boolean).map(Number);
    const open  = all.find(t=>!t.archived && t.status !== "done");
    const warr  = all.find(t=>warrantyDaysLeft(t) > 0);
    const st    = open ? ((STATUSES.find(x=>x.id===open.status)||{}).label || open.status) : null;

    return `<div style="border:1px solid var(--accent);border-radius:9px;padding:12px 13px;margin-bottom:8px;background:var(--bg);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:1.08rem;font-weight:700;">${escapeHtml(latest.vehicle)}</div>
          <div style="font-size:.92rem;font-weight:600;color:var(--accent);margin-top:1px;">
            ${latest.makeModel ? escapeHtml(latest.makeModel) : "<span style='color:var(--muted);font-weight:500;'>no make/model on file</span>"}
          </div>
          <div class="meta" style="margin-top:4px;">
            ${escapeHtml(latest.customer||"")}${latest.phone?" \u00b7 "+escapeHtml(fmtPhoneDash(latest.phone)):""}
          </div>
          <div class="meta" style="margin-top:3px;">
            ${all.length} visit${all.length===1?"":"s"} \u00b7 $${spent.toFixed(2)} total
            ${miles.length?" \u00b7 "+Math.max(...miles).toLocaleString()+" mi":""}
            \u00b7 last in ${fmtDate(latest.createdAt)}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end;">
          ${open ? `<span class="badge status-${open.status}">${escapeHtml(st)}</span>`
                 : `<span class="badge" style="background:var(--done);">Not in shop</span>`}
          ${owed > 0.005 ? `<span class="badge" style="background:#dc2626;">Owes $${owed.toFixed(2)}</span>` : ""}
          ${warr ? `<span class="badge" style="background:#0891b2;">Warranty ${warrantyDaysLeft(warr)}d</span>` : ""}
        </div>
      </div>
      <div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;">
        <button type="button" class="btn-edit" data-sv-hist="${latest.id}" style="padding:5px 11px;font-size:.78rem;">Full history</button>
        ${open ? `<button type="button" class="btn-edit" data-sv-edit="${open.id}" style="padding:5px 11px;font-size:.78rem;">Open job</button>` : ""}
      </div>
    </div>`;
  }).join("");

  const more = keys.length > 4
    ? `<div class="meta" style="margin-bottom:6px;">${keys.length - 4} more vehicle${keys.length-4===1?"":"s"} match &mdash; see the list below.</div>` : "";

  el.innerHTML = `<div style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;">
      ${keys.length === 1 ? "Vehicle found" : keys.length + " vehicles found"}
    </div>${cards}${more}`;

  el.querySelectorAll("[data-sv-hist]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const t = trucks.find(x=>x.id===b.getAttribute("data-sv-hist"));
      if(t) openVehicleHistory(t);
    });
  });
  el.querySelectorAll("[data-sv-edit]").forEach(b=>{
    b.addEventListener("click", ()=>startEdit(b.getAttribute("data-sv-edit")));
  });
}

function cleanVin(v){ return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }

function looksLikeVin(v){
  const c = cleanVin(v);
  return c.length === 17 && !/[IOQ]/.test(c);
}

function decodeVinLocal(v){
  const c = cleanVin(v);
  if(c.length !== 17) return null;
  return { make: VIN_WMI[c.slice(0,3)] || null, year: VIN_YEAR[c[9]] || null, vin: c };
}

// Has this plate or VIN been here before?
function findKnownVehicle(raw){
  const k = normVeh(raw);
  if(!k || k.length < 4) return null;
  const hits = trucks.filter(t=>!t.deleted && normVeh(t.vehicle) === k)
                     .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return hits.length ? hits[0] : null;
}

let lastLookedUp = "";

async function runVehicleLookup(auto){
  const raw = document.getElementById("f-vehicle").value.trim();
  const mm = document.getElementById("f-makeModel");
  if(!raw){ setLookupMsg(""); lastLookedUp = ""; return; }
  if(auto && raw === lastLookedUp) return;
  lastLookedUp = raw;

  // 1. Our own records win - instant and always right
  const prev = findKnownVehicle(raw);
  if(prev && prev.makeModel){
    mm.value = prev.makeModel;
    const cu = document.getElementById("f-customer");
    const ph = document.getElementById("f-phone");
    if(!cu.value && prev.customer) cu.value = prev.customer;
    if(!ph.value && prev.phone)    ph.value = fmtPhoneDash(prev.phone);
    setLookupMsg(`<span style="color:var(--ready);">&#10003; From your records: ${escapeHtml(prev.makeModel)}</span>`);
    return;
  }

  // 2. A VIN can actually be decoded
  const vinPart = (raw.match(/[A-HJ-NPR-Z0-9]{17}/i) || [])[0];
  if(vinPart && looksLikeVin(vinPart)){
    const local = decodeVinLocal(vinPart);
    if(local && (local.make || local.year)){
      mm.value = [local.year, local.make].filter(Boolean).join(" ");
      setLookupMsg(`<span style="color:var(--ready);">&#10003; VIN decoded: ${escapeHtml(mm.value)}</span> <span style="color:var(--muted);">checking model&hellip;</span>`);
    } else {
      setLookupMsg("Reading VIN&hellip;");
    }
    if(!sampleFn){
      setLookupMsg(mm.value
        ? `<span style="color:var(--ready);">&#10003; VIN decoded: ${escapeHtml(mm.value)}</span> <span style="color:var(--muted);">add the model by hand</span>`
        : "Couldn't decode that VIN. Check the characters and try again.");
      return;
    }
    {
      try{
        const r = await sampleFn.json(
          "Decode this vehicle VIN and reply with ONLY a JSON object " +
          '{"year":"","make":"","model":"","body":""} - use empty strings for anything you are not confident about. ' +
          "Do not guess the model if the VIN does not clearly determine it. VIN: " + vinPart,
          { modelTier: "default" }
        );
        const full = [r.year, r.make, r.model].filter(Boolean).join(" ").trim();
        if(full.length > (mm.value||"").length){
          mm.value = full;
          setLookupMsg(`<span style="color:var(--ready);">&#10003; VIN decoded: ${escapeHtml(full)}</span> <span style="color:var(--muted);">check it before saving</span>`);
        } else if(mm.value){
          setLookupMsg(`<span style="color:var(--ready);">&#10003; VIN decoded: ${escapeHtml(mm.value)}</span> <span style="color:var(--muted);">model not certain from the VIN</span>`);
        } else {
          setLookupMsg("Couldn't decode that VIN. Check the characters and try again.");
        }
      }catch(err){
        if(!mm.value) setLookupMsg("Couldn't decode that VIN here. Enter the make/model by hand.");
      }
    }
    return;
  }

  // 3. A plate we've never seen - hand it off to something that can
  if(auto && raw.replace(/[^A-Za-z0-9]/g,"").length < 5){ setLookupMsg(""); return; }
  const st = (document.getElementById("f-plateState").value || "").toUpperCase();
  const bare = raw.replace(new RegExp("^" + (st || "ZZ") + "[\\s-]+", "i"), "").trim();
  const directUrl = plateLookupUrl(st, bare);
  setLookupMsg(`
    ${directUrl ? `<a href="${directUrl}" target="_blank" rel="noopener noreferrer"
        style="display:block;text-align:center;text-decoration:none;background:var(--accent);color:#fff;
               font-weight:700;font-size:.85rem;border-radius:7px;padding:10px;margin-bottom:7px;">
        Look up ${escapeHtml(st + " " + bare)} &#8599;</a>`
      : `<div style="color:#d97706;margin-bottom:7px;">Pick the state and I can look this plate up for you.</div>`}
    ${directUrl ? `<div style="color:var(--muted);margin:-3px 0 8px;font-size:.76rem;">
        Not every plate is in their data &mdash; if it comes back 404, scan the VIN.
      </div>` : ""}
    <div style="color:var(--muted);margin-bottom:7px;">${directUrl ? "Or:" : "This app can't decode a plate itself &mdash; pick one:"}</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;">
      <a class="btn-edit" id="azpBtn" href="https://www.autozonepro.com" target="_blank" rel="noopener noreferrer"
        style="padding:6px 11px;font-size:.78rem;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer;">AutoZonePro &#8599;</a>
      <button type="button" class="btn-edit" id="scanVinBtn" style="padding:6px 11px;font-size:.78rem;">&#128247; Scan the VIN</button>
    </div>
    <div id="lookupHint" style="color:var(--muted);margin-top:6px;">${directUrl ? "Read the make/model off that page and type it below." : ""}</div>`);

  document.getElementById("azpBtn").addEventListener("click", ()=>{
    const hint = document.getElementById("lookupHint");
    copyText(bare, hint, st
      ? `Plate copied \u2713 pick ${st} in their state dropdown, then paste. Type the make/model here when you have it.`
      : "Plate copied \u2713 paste it there, then type the make/model here.");
  });

  document.getElementById("scanVinBtn").addEventListener("click", ()=>{
    document.getElementById("lookupHint").textContent =
      "Take a clear photo of the VIN plate, then press \u201cRead Plate / VIN\u201d under the picture.";
    document.getElementById("f-photo").click();
  });
}

function invMatch(t, q){
  const n = invNum(t).toLowerCase();
  if(!n) return false;
  const qq = String(q).replace(/^#|^inv[-\s#]*/i,"").trim();
  return !!qq && (n === qq || n.includes(qq) || String(parseInt(n,10)) === qq);
}
function invBadge(t){ return hasInvNum(t) ? `<span class="inv-badge" title="Invoice number">#${escapeHtml(invNum(t))}</span>` : ""; }
function jobVin(t){ return (t && t.vin) ? String(t.vin).toUpperCase() : vinFromJob(t||{}); }
function vinFromJob(t){
  const m = String(t.vehicle||"").toUpperCase().match(/[A-HJ-NPR-Z0-9]{17}/);
  return m ? m[0] : null;
}

function copyText(txt, okEl, okMsg){
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";

  try{ document.execCommand("copy"); if(okEl) okEl.textContent = okMsg; }
  catch(e){ if(okEl) okEl.textContent = "Couldn't copy — select it by hand."; }
  ta.remove();
}

let confirmResolve = null;

function askConfirm(message, yesLabel){
  return new Promise(resolve=>{
    confirmResolve = resolve;
    document.getElementById("confirmMsg").textContent = message;
    document.getElementById("confirmYes").textContent = yesLabel || "Yes";
    const ov = document.getElementById("confirmOverlay");
    ov.style.display = "flex";
    document.getElementById("confirmYes").focus();
  });
}
function askChoice(message, choices){
  return new Promise(resolve=>{
    confirmResolve = resolve;
    document.getElementById("confirmMsg").textContent = message;
    document.getElementById("confirmBtns").style.display = "none";
    const extra = document.getElementById("confirmExtra");
    extra.style.display = "flex";
    extra.innerHTML = choices.map((c,i)=>
      `<button type="button" data-choice="${c.key}" style="width:100%;padding:12px;font-size:.92rem;font-weight:600;
        border-radius:8px;border:1px solid ${c.style==="primary"?"var(--accent)":c.style==="danger"?"#dc2626":"var(--border)"};
        background:${c.style==="primary"?"var(--accent)":"transparent"};
        color:${c.style==="primary"?"#fff":c.style==="danger"?"#dc2626":"var(--muted)"};">${c.label}</button>`).join("");
    extra.querySelectorAll("[data-choice]").forEach(btn=>{
      btn.addEventListener("click", ()=>closeConfirm(btn.getAttribute("data-choice")));
    });
    document.getElementById("confirmOverlay").style.display = "flex";
  });
}

function closeConfirm(answer){
  document.getElementById("confirmBtns").style.display = "flex";
  document.getElementById("confirmExtra").style.display = "none";
  document.getElementById("confirmOverlay").style.display = "none";
  const r = confirmResolve; confirmResolve = null;
  if(r) r(answer);
}
document.getElementById("confirmYes").addEventListener("click", ()=>closeConfirm(true));
document.getElementById("confirmNo").addEventListener("click", ()=>closeConfirm(false));
document.getElementById("confirmOverlay").addEventListener("click", (e)=>{
  if(e.target.id === "confirmOverlay") closeConfirm(false);
});
document.addEventListener("keydown", (e)=>{
  if(confirmResolve && e.key === "Escape"){ e.stopPropagation(); closeConfirm(false); }
}, true);

      </div>

    </div>
  `);

  const QUICK_JOBS = ["Tire plug","Jump start","Bulb","Wiper blades","Top-up fluids","Battery","Diagnostic"];

    const isCard = document.getElementById("q-pay").value === "Card";
    document.getElementById("q-feeWrap").style.display = isCard ? "" : "none";
    const fee = (isCard && document.getElementById("q-fee").checked) ? (amt + tax) * CARD_FEE : 0;
    document.getElementById("q-feeLbl").textContent = fee > 0 ? "+$" + fee.toFixed(2) : "";
    document.getElementById("q-sub").textContent   = "$" + amt.toFixed(2);

    document.getElementById("q-total").textContent = "$" + (amt + tax + fee).toFixed(2);
  }
  document.getElementById("q-pay").addEventListener("change", ()=>{
    document.getElementById("q-fee").checked = document.getElementById("q-pay").value === "Card";
    qTotals();
  });
  document.getElementById("q-fee").addEventListener("change", qTotals);
  document.getElementById("q-amt").addEventListener("input", qTotals);
  document.getElementById("q-taxOn").addEventListener("change", qTotals);

    if(amt <= 0){ msg.innerHTML = '<span style="color:#dc2626;">Enter the charge.</span>'; return; }

    const plate = document.getElementById("q-plate").value.trim();
    const qNoTax = !document.getElementById("q-taxOn").checked;
    const qFee = document.getElementById("q-pay").value === "Card" && document.getElementById("q-fee").checked;
    const total = amt * (qNoTax ? 1 : 1.08) * (qFee ? 1 + CARD_FEE : 1);
    const btn = document.getElementById("q-save");
    btn.disabled = true;

    await addTruck({
      vehicle: plate || "Walk-in",
      plateState: plate ? DEFAULT_STATE : "",
      customer: document.getElementById("q-cust").value.trim() || "Walk-in",
      issue: issue,
      jobType: "Mechanical",
      quickAmount: String(amt),
      quickJob: true,
      noTax: qNoTax,
      cardFee: qFee,
      paid: total.toFixed(2),
      paidAt: Date.now(),
      paymentMethod: document.getElementById("q-pay").value,
      paymentStatus: "paid",
      status: "done",
      partsList: [], workList: []
    });

    hideOverlay("panelOverlay");
    showToast(`Quick job saved \u2014 $${total.toFixed(2)} ${document.getElementById("q-pay").value.toLowerCase()}`);
  });
}

const MAKE_ALIAS = {"chevy":"Chevrolet","vw":"Volkswagen","benz":"Mercedes-Benz","mercedes":"Mercedes-Benz","merc":"Mercedes-Benz","gm":"GMC","landrover":"Land Rover","range rover":"Land Rover","inter":"International","navistar":"International","freight":"Freightliner","kw":"Kenworth","pete":"Peterbilt","dodge ram":"Ram","volvo truck":"Volvo Trucks"};
const MAKES = Object.keys(CAR_DB);

function mmSuggest(raw){
  let q = String(raw||"");
  const ym = q.match(/^\s*((?:19|20)\d{2})\s+/);
  const year = ym ? ym[1] + " " : "";
  if(ym) q = q.slice(ym[0].length);
  const ql = q.trim().toLowerCase();
  if(!ql) return [];
  const out = [], seen = new Set();
  const add = (label, value, kind, keepOpen)=>{
    const key = value.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key); out.push({label, value: year + value, kind, keepOpen});
  };
  const hl = (text, part)=>{
    const i = text.toLowerCase().indexOf(part);
    if(i < 0 || !part) return escapeHtml(text);
    return escapeHtml(text.slice(0,i)) + "<b>" + escapeHtml(text.slice(i, i+part.length)) + "</b>" + escapeHtml(text.slice(i+part.length));
  };
  const norm = x=>x.toLowerCase().replace(/[^a-z0-9]/g,"");
  // 1) a full make typed, then a space: show that make's models
  const fullMake = MAKES.slice().sort((a,b)=>b.length-a.length).find(m=> ql === m.toLowerCase() || ql.startsWith(m.toLowerCase() + " "))
    || Object.keys(MAKE_ALIAS).filter(a=> ql === a || ql.startsWith(a + " ")).map(a=>MAKE_ALIAS[a])[0];
  if(fullMake){
    const alias = Object.keys(MAKE_ALIAS).find(a=>MAKE_ALIAS[a]===fullMake && (ql===a || ql.startsWith(a+" ")));
    const prefixLen = (alias && !ql.startsWith(fullMake.toLowerCase())) ? alias.length : fullMake.length;
    const rest = ql.slice(prefixLen).trim();
    CAR_DB[fullMake].filter(m=> !rest || norm(m).startsWith(norm(rest)) || m.toLowerCase().includes(rest))
      .forEach(m=> add(escapeHtml(fullMake) + " " + hl(m, rest), fullMake + " " + m, "model"));
    if(out.length) return out.slice(0, 10);
  }
  // 2) makes that start with what was typed (Toy -> Toyota), aliases too
  MAKES.filter(m=>m.toLowerCase().startsWith(ql)).forEach(m=> add(hl(m, ql), m + " ", "make", true));
  Object.keys(MAKE_ALIAS).filter(a=>a.startsWith(ql)).forEach(a=>{ const m = MAKE_ALIAS[a]; add(escapeHtml(m), m + " ", "make", true); });
  // 3) models that start with it (cam -> Toyota Camry, f15 -> Ford F-150)
  const nq = norm(ql);
  if(nq.length >= 2){
    MAKES.forEach(mk=> CAR_DB[mk].forEach(m=>{ if(norm(m).startsWith(nq)) add(escapeHtml(mk) + " " + hl(m, ql), mk + " " + m, "model"); }));
  }
  // 4) what this shop has typed before
  const past = [...new Set(trucks.map(t=>(t.makeModel||"").trim()).filter(Boolean))];
  past.filter(p=>p.toLowerCase().includes(ql)).slice(0,4).forEach(p=> add(hl(p, ql), p, "past"));
  return out.slice(0, 10);
}

function attachMakeModel(inp, list){
  if(!inp || !list || inp.dataset.mmWired) return;
  inp.dataset.mmWired = "1";
  let items = [], on = -1;
  const close = ()=>{ list.style.display = "none"; items = []; on = -1; };
  const draw = ()=>{
    items = mmSuggest(inp.value);
    if(!items.length){ close(); return; }
    on = -1;
    list.innerHTML = items.map((it,i)=>`<div class="mm-opt" role="option" data-mm="${i}"><span class="mm-lbl">${it.label}</span><span class="mm-tag">${it.kind==="make"?"Make":it.kind==="past"?"Used before":""}</span></div>`).join("");
    list.style.display = "";
  };
  const pick = i=>{
    const it = items[i]; if(!it) return;
    inp.value = it.value;
    inp.dispatchEvent(new Event("change", {bubbles:true}));
    if(typeof formDirty !== "undefined") formDirty = true;
    if(it.keepOpen){ inp.focus(); draw(); } else close();
  };
  inp.addEventListener("input", draw);
  inp.addEventListener("focus", ()=>{ if(inp.value.trim()) draw(); });
  inp.addEventListener("blur", ()=> setTimeout(close, 150));
  list.addEventListener("mousedown", e=>{ const o = e.target.closest("[data-mm]"); if(o){ e.preventDefault(); pick(+o.dataset.mm); } });
  inp.addEventListener("keydown", e=>{
    if(list.style.display === "none") return;
    if(["ArrowDown","ArrowUp","Enter","Tab","Escape"].includes(e.key)) e.stopPropagation();
    const opts = list.querySelectorAll(".mm-opt");
    if(e.key === "ArrowDown"){ e.preventDefault(); on = Math.min(items.length-1, on+1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); on = Math.max(0, on-1); }
    else if(e.key === "Enter"){ if(items.length){ e.preventDefault(); pick(on >= 0 ? on : 0); } return; }
    else if(e.key === "Tab"){ if(items.length){ e.preventDefault(); pick(on >= 0 ? on : 0); } return; }
    else if(e.key === "Escape"){ close(); return; }
    else return;
    opts.forEach((o,i)=>o.classList.toggle("on", i===on));
    if(opts[on]) opts[on].scrollIntoView({block:"nearest"});
  });
}

function partSuggest(raw){
  const ql = String(raw||"").trim().toLowerCase();
  if(!ql) return [];
  const words = ql.split(/\s+/);
  const score = name=>{
    const n = name.toLowerCase();
    const nw = n.split(/[\s()\/\-,&]+/).filter(Boolean);
    if(n.startsWith(ql)) return 3;
    if(words.every(w=> nw.some(x=>x.startsWith(w)))) return 2;
    if(n.includes(ql)) return 1;
    return 0;
  };
  const past = [];
  const seenPast = new Set();
  trucks.forEach(t=> (t.partsList||[]).forEach(p=>{
    const nm = (p.name||"").trim();
    if(nm && !seenPast.has(nm.toLowerCase())){ seenPast.add(nm.toLowerCase()); past.push(nm); }
  }));
  partsList.forEach(p=>{ const nm=(p.name||"").trim(); if(nm) seenPast.delete(nm.toLowerCase()); });
  const out = [], seen = new Set();
  const push = (name, kind)=>{ const k = name.toLowerCase(); if(seen.has(k) || k === ql) return; seen.add(k); out.push({name, kind}); };
  past.map(n=>[n,score(n)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,4).forEach(x=>push(x[0],"past"));
  PART_DB.map(n=>[n,score(n)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0])).forEach(x=>push(x[0],"list"));
  return out.slice(0, 10);
}

(function wirePartSuggest(){
  const box = document.createElement("div");
  box.id = "ptList"; box.className = "mm-list pt-list"; box.style.display = "none";
  document.body.appendChild(box);
  let inp = null, items = [], on = -1;
  const close = ()=>{ box.style.display = "none"; items = []; on = -1; };
  const place = ()=>{
    if(!inp) return;
    const r = inp.getBoundingClientRect();
    box.style.left = r.left + "px"; box.style.top = (r.bottom + 3) + "px"; box.style.minWidth = r.width + "px";
  };
  const hl = (text, q)=>{
    let h = escapeHtml(text);
    q.trim().split(/\s+/).filter(Boolean).forEach(w=>{
      const re = new RegExp("(^|[\\s(\\/\\-])(" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "i");
      h = h.replace(re, "$1<b>$2</b>");
    });
    return h;
  };
  const draw = ()=>{
    items = partSuggest(inp.value);
    if(!items.length){ close(); return; }
    on = -1;
    box.innerHTML = items.map((it,i)=>`<div class="mm-opt" data-pt="${i}"><span class="mm-lbl">${hl(it.name, inp.value)}</span><span class="mm-tag">${it.kind==="past"?"Used before":""}</span></div>`).join("");
    box.style.display = ""; place();
  };
  const pick = i=>{
    const it = items[i]; if(!it || !inp) return;
    inp.value = it.name;
    inp.dispatchEvent(new Event("input", {bubbles:true}));
    if(typeof formDirty !== "undefined") formDirty = true;
    close();
  };
  const isPartName = el=> el && el.matches && el.matches('#partsRows input[data-pf="name"]');
  document.addEventListener("focusin", e=>{ if(isPartName(e.target)){ inp = e.target; if(inp.value.trim()) draw(); } });
  document.addEventListener("focusout", e=>{ if(isPartName(e.target)) setTimeout(()=>{ if(document.activeElement !== inp) close(); }, 150); });
  document.addEventListener("input", e=>{ if(isPartName(e.target) && e.isTrusted){ inp = e.target; draw(); } });
  document.addEventListener("keydown", e=>{
    if(!isPartName(e.target) || box.style.display === "none") return;
    if(["ArrowDown","ArrowUp","Enter","Tab","Escape"].includes(e.key)) e.stopImmediatePropagation();
    const opts = box.querySelectorAll(".mm-opt");
    if(e.key === "ArrowDown"){ e.preventDefault(); on = Math.min(items.length-1, on+1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); on = Math.max(0, on-1); }
    else if(e.key === "Enter" || e.key === "Tab"){ if(items.length){ e.preventDefault(); pick(on >= 0 ? on : 0); } return; }
    else if(e.key === "Escape"){ close(); return; }
    else return;
    opts.forEach((o,i)=>o.classList.toggle("on", i===on));
    if(opts[on]) opts[on].scrollIntoView({block:"nearest"});
  }, true);
  box.addEventListener("mousedown", e=>{ const o = e.target.closest("[data-pt]"); if(o){ e.preventDefault(); pick(+o.dataset.pt); } });
  document.addEventListener("pointerdown", e=>{ if(box.style.display !== "none" && !box.contains(e.target) && e.target !== inp) close(); }, true);
  window.addEventListener("scroll", ()=>{ if(box.style.display !== "none") place(); }, true);
  window.addEventListener("resize", ()=>{ if(box.style.display !== "none") place(); });
})();
// Mouse wheel never changes a number box: drop focus so the page scrolls instead
document.addEventListener("wheel", e=>{
  const el = e.target;
  if(el && el.tagName === "INPUT" && el.type === "number" && document.activeElement === el) el.blur();
}, {passive:true, capture:true});

function typePhone(raw){
  let d = String(raw||"").replace(/\D/g,"");
  if(d.length === 11 && d[0] === "1") d = d.slice(1);
  d = d.slice(0,10);
  if(d.length <= 3) return d;
  if(d.length <= 6) return d.slice(0,3) + "-" + d.slice(3);
  return d.slice(0,3) + "-" + d.slice(3,6) + "-" + d.slice(6);
}

      render();
      const list = document.getElementById("list");
      if(list && window.innerWidth < 1000) list.scrollIntoView({behavior:"smooth", block:"start"});
    });
    statsEl.appendChild(b);
  }

  stage("all", "All", live.filter(t=>t.status !== "done").length);
  STATUSES.forEach(s=>{
    stage(s.id, SHORT[s.id] || s.label, live.filter(t=>t.status === s.id).length);
  });
}

function render(){
  renderStats();
  renderSearchSummary();

  const list = document.getElementById("list");
  list.innerHTML = "";
  const searching = !!searchQuery;
  const items = trucks
    .filter(t => searching ? !t.deleted : (!t.archived && !t.deleted))
    .filter(t => searching ? true : (filter === "all" ? t.status !== "done" : t.status === filter))
    .filter(t => {
      if(!searchQuery) return true;
      const q = searchQuery.toLowerCase();
      return (t.vehicle||"").toLowerCase().includes(q)
        || (t.customer||"").toLowerCase().includes(q)
        || (t.phone||"").toLowerCase().includes(q)
        || (t.makeModel||"").toLowerCase().includes(q)
        || (t.issue||"").toLowerCase().includes(q)
        || invMatch(t, q);
    })
    .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

    renderBoard(list, items);
    renderTail();

      const id = e.target.getAttribute("data-id");

    });
  });
  list.querySelectorAll("[data-approve],[data-decline]").forEach(btn=>{

      const [jid, wid] = e.target.getAttribute(approve ? "data-approve" : "data-decline").split("|");
      const t = trucks.find(x=>x.id===jid);
      if(!t) return;
      const wl = (t.workList||[]).map(w=> w.id===wid ? {...w, status: approve?"approved":"declined", decidedAt: Date.now()} : w);

function renderTail(){

  renderDeclined();

const BOARD_STAGES = ["received","diagnosing","awaitingApproval","waitingParts","repair","ready"];

function tilePay(t){
  const total = jobTotal(t);
  if(total <= 0) return "";
  const bal = jobBalance(t);
  if(t.paymentStatus === "paid" || bal <= 0.005) return `<span class="pay" style="background:var(--ready);">Paid</span>`;
  if(jobPaid(t) > 0) return `<span class="pay" style="background:#d97706;">Bal $${bal.toFixed(0)}</span>`;
  return `<span class="pay" style="background:#dc2626;">Unpaid</span>`;
}

function tileDays(t){
  const d = daysInShop(t);
  if(d < 1) return `<span style="color:var(--muted);">today</span>`;
  const color = d >= 14 ? "#dc2626" : (d >= 7 ? "#d97706" : "var(--muted)");
  return `<span style="color:${color};font-weight:${d>=7?700:500};">${d}d</span>`;
}

async function moveJob(id, dir){
  const t = trucks.find(x=>x.id===id);
  if(!t) return;
  const order = STATUSES.map(s=>s.id);
  const i = order.indexOf(t.status);
  const next = order[Math.max(0, Math.min(order.length-1, i + dir))];
  if(!next || next === t.status) return;
  await updateTruck(id, {status: next});
}

function renderBoard(list, items){
  const readonly = document.body.classList.contains("readonly");
  const board = document.createElement("div");
  board.className = "board";

  BOARD_STAGES.forEach(stageId=>{
    const st = STATUSES.find(s=>s.id===stageId);
    const jobs = items.filter(t=>t.status === stageId)
      .sort((a,b)=> (a.createdAt||0) - (b.createdAt||0));   // oldest first = most urgent on top
    const col = document.createElement("div");
    col.className = "bcol";
    col.setAttribute("data-stage", stageId);
    col.innerHTML = `
      <div class="bcol-h"><span class="dot" style="background:var(--${stageId});"></span>${st.label}<span class="cnt">${jobs.length}</span></div>
      ${jobs.length ? "" : `<div class="bcol-empty">\u2014</div>`}
      ${jobs.map(t=>{
        const total = jobTotal(t);
        const flags = [];
        if(t.timerStart) flags.push(`<span style="background:rgba(22,163,74,.14);color:#16a34a;">\u25CF On clock</span>`);
        if(t.towed) flags.push(t.milesEstimated
          ? `<span style="background:rgba(220,38,38,.12);color:#dc2626;">Tow mi unverified</span>`
          : `<span style="background:var(--bg);color:var(--muted);border:1px solid var(--border);">Towed</span>`);
        if(t.jobType && t.jobType !== "Mechanical") flags.push(`<span style="background:var(--bg);color:var(--muted);border:1px solid var(--border);">${escapeHtml(t.jobType)}</span>`);
        const idx = STATUSES.findIndex(s=>s.id===t.status);
        return `
        <div class="tile${editingId===t.id?" editing":""}" data-tile="${t.id}" ${readonly?"":'draggable="true"'} style="border-left-color:var(--${t.status});">
          <div class="tile-mm">${invBadge(t)}${escapeHtml(t.makeModel || t.vehicle || "\u2014")}</div>
          <div class="tile-pl">${t.makeModel ? escapeHtml(t.vehicle) : ""}${t.customer ? ` <span>${t.makeModel ? "\u00b7 " : ""}${escapeHtml(t.customer)}</span>` : ""}</div>
          ${t.issue ? `<div class="tile-is" title="${escapeHtml(t.issue)}">${escapeHtml(t.issue)}</div>` : ""}
          <div class="tile-ft">
            <span>${total > 0 ? `<span class="tile-amt">$${total.toFixed(2)}</span>${tilePay(t)}` : `<span style="color:var(--muted);">no charges yet</span>`}</span>
            ${tileDays(t)}
          </div>
          ${flags.length ? `<div class="tile-flags">${flags.join("")}</div>` : ""}
          <div class="tile-act">
            <button type="button" class="edit-only" data-mv="${t.id}|-1" title="Back a stage" ${idx<=0?"disabled":""}>\u25C0</button>
            <button type="button" data-tinv="${t.id}" title="Invoice">\u{1F9FE}</button>
            <button type="button" data-two="${t.id}" title="Work order">\u{1F4CB}</button>
            <button type="button" data-tparts="${t.id}" title="Find parts">\u{1F50D}</button>
            <button type="button" class="edit-only" data-mv="${t.id}|1" title="${t.status==="ready"?"Mark completed":"Next stage"}">${t.status==="ready"?"\u2713":"\u25B6"}</button>
          </div>
        </div>`;
      }).join("")}
    `;
    board.appendChild(col);
  });
  list.appendChild(board);

  const find = id => trucks.find(x=>x.id===id);
  board.querySelectorAll("[data-mv]").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const [id, d] = b.getAttribute("data-mv").split("|");
    moveJob(id, +d);
  }));
  board.querySelectorAll("[data-tinv]").forEach(b=>b.addEventListener("click", e=>{ e.stopPropagation(); const t=find(b.getAttribute("data-tinv")); if(t) openInvoice(t); }));
  board.querySelectorAll("[data-two]").forEach(b=>b.addEventListener("click", e=>{ e.stopPropagation(); const t=find(b.getAttribute("data-two")); if(t) openWorkOrder(t); }));
  board.querySelectorAll("[data-tparts]").forEach(b=>b.addEventListener("click", e=>{ e.stopPropagation(); const t=find(b.getAttribute("data-tparts")); if(t) openPartsLookup(t); }));
  board.querySelectorAll("[data-tile]").forEach(tile=>{
    tile.addEventListener("click", e=>{
      if(e.target.closest("button, a")) return;
      if(readonly){ const t=find(tile.getAttribute("data-tile")); if(t) openWorkOrder(t); return; }
      startEdit(tile.getAttribute("data-tile"));
    });
    if(readonly) return;
    tile.addEventListener("dragstart", e=>{
      e.dataTransfer.setData("text/plain", tile.getAttribute("data-tile"));
      e.dataTransfer.effectAllowed = "move";
      tile.classList.add("dragging");
    });
    tile.addEventListener("dragend", ()=>{
      tile.classList.remove("dragging");
      board.querySelectorAll(".bcol.drop").forEach(c=>c.classList.remove("drop"));
    });
  });
  if(!readonly) board.querySelectorAll(".bcol").forEach(col=>{
    col.addEventListener("dragover", e=>{ e.preventDefault(); e.dataTransfer.dropEffect = "move"; col.classList.add("drop"); });
    col.addEventListener("dragleave", e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove("drop"); });
    col.addEventListener("drop", async e=>{
      e.preventDefault();
      col.classList.remove("drop");
      const id = e.dataTransfer.getData("text/plain");
      const stage = col.getAttribute("data-stage");
      const t = find(id);
      if(t && t.status !== stage){
        await updateTruck(id, {status: stage});
      }
    });
  });
}

function fmtTime(hhmm){
  if(!hhmm) return "";
  const [h,m] = hhmm.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,"0")} ${ap}`;
}

function fmtPhoneDash(p){
  const d = String(p||"").replace(/\D/g,"");
  if(d.length === 10) return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);
  if(d.length === 11 && d[0] === "1") return d.slice(1,4)+"-"+d.slice(4,7)+"-"+d.slice(7);
  return String(p||"");
}
function renderUpcoming(){
  const wrap = document.getElementById("upcomingWrap");
  const el = document.getElementById("upcomingList");
  const today = new Date(); today.setHours(0,0,0,0);
  const up = trucks.filter(t=>!t.deleted && !t.archived && t.status !== "done" && t.scheduled && new Date(t.scheduled+"T00:00:00") >= today)
    .sort((a,b)=> (a.scheduled+(a.scheduledTime||"99:99")).localeCompare(b.scheduled+(b.scheduledTime||"99:99")));
  if(up.length === 0){ wrap.style.display = "none"; return; }
  wrap.style.display = "block";

  let lastDay = null;
  el.innerHTML = up.map(t=>{
    const d = new Date(t.scheduled+"T00:00:00");
    const days = Math.round((d - today)/86400000);
    const label = days === 0 ? "\u{1F4C5} Today" : days === 1 ? "Tomorrow"
      : d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
    const showDay = t.scheduled !== lastDay;
    lastDay = t.scheduled;
    const plate = (t.vehicle && t.vehicle.trim() && t.vehicle.trim() !== "?") ? t.vehicle.trim() : "";
    const car = t.makeModel ? t.makeModel + (plate ? " \u00b7 " + plate : "") : plate;
    const rest = [t.customer, t.phone ? fmtPhoneDash(t.phone) : "", t.issue].filter(Boolean).map(escapeHtml).join(" \u00b7 ");
    return `<div class="sched-row" data-sched="${t.id}" title="Open job">
      <span class="sched-day${days<=1?" soon":""}">${showDay ? label : ""}</span>
      <span class="sched-time${t.scheduledTime?"":" none"}">${t.scheduledTime ? fmtTime(t.scheduledTime) : "no time"}</span>
      <span class="sched-car${car?"":" none"}">${car ? escapeHtml(car) : "No plate yet"}</span>
      <span class="sched-rest">${rest ? "\u00b7 " + rest : ""}</span>
    </div>`;
  }).join("");
  el.querySelectorAll("[data-sched]").forEach(r=>r.addEventListener("click", ()=>{
    if(document.body.classList.contains("readonly")){ const t=trucks.find(x=>x.id===r.getAttribute("data-sched")); if(t) openWorkOrder(t); return; }
    startEdit(r.getAttribute("data-sched"));
  }));
}

  document.getElementById("trashCount").textContent = gone.length ? `(${gone.length})` : "";
  if(gone.length === 0){ el.innerHTML = '<div class="empty">Trash is empty.</div>'; return; }
  el.innerHTML = "";
  gone.forEach(t=>{
    const div = document.createElement("div");
    div.className = "truck";
    const days = t.deletedAt ? Math.floor((Date.now()-t.deletedAt)/86400000) : null;
    div.innerHTML = `
      <div class="truck-top">
        ${t.photo ? `<img src="${t.photo}" style="width:52px;height:52px;object-fit:cover;border-radius:7px;border:1px solid var(--border);flex-shrink:0;">` : ""}
        <div style="flex:1;">
          <h3>${escapeHtml(t.vehicle)}</h3>
          <div class="meta">${escapeHtml(t.customer||"")}${t.phone?" \u00b7 "+escapeHtml(fmtPhoneDash(t.phone)):""} \u00b7 ${escapeHtml(t.issue||"")}${jobTotal(t)>0?" \u00b7 $"+jobTotal(t).toFixed(2):""}</div>
          <div class="meta" style="margin-top:3px;">Deleted ${days===null?"":days===0?"today":days+" day"+(days===1?"":"s")+" ago"}</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn-edit edit-only owner-only" data-untrash="${t.id}">Restore</button>
        <button class="btn-edit" data-invoice="${t.id}">Invoice</button>
        <button class="btn-danger edit-only owner-only" data-purge="${t.id}">Delete forever</button>
      </div>`;
    el.appendChild(div);
  });
  el.querySelectorAll("[data-purge]").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      const id = e.target.getAttribute("data-purge");
      const t = trucks.find(x=>x.id===id);
      const ok = await askConfirm(`Delete ${t ? (t.makeModel || t.vehicle) : "this job"} forever? This can't be undone.`, "Delete forever");
      if(ok) await deleteTruck(id);
    });
  });
  el.querySelectorAll("[data-untrash]").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      await updateTruck(e.target.getAttribute("data-untrash"), {deleted: false, deletedAt: null});
    });
  });
  el.querySelectorAll("[data-invoice]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      const t = trucks.find(x=>x.id===e.target.getAttribute("data-invoice"));
      if(t) openInvoice(t);
    });

let galleryPhotos = [];

function compressImage(file, maxW){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---- Plate / VIN auto-detection ----
let sampleFn = null;
let sampleImagesOK = false;

function dataUrlToBlob(dataUrl){
  const [head, body] = dataUrl.split(",");
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(body);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

function wireScanButton(){
  const b = document.getElementById("scanPlateBtn");
  if(b) b.addEventListener("click", ()=>runPlateScan());
}

async function runPlateScan(){
  const status = document.getElementById("scanStatus");
  const btn = document.getElementById("scanPlateBtn");
  if(!photoData){ status.textContent = "Add a photo first."; return; }
  if(!sampleFn || !sampleImagesOK){
    status.textContent = "Photo reading isn't available here — type it in manually.";
    return;
  }
  if(btn) btn.disabled = true;
  status.textContent = "Reading photo…";
  try{
    const blob = dataUrlToBlob(photoData);
    const result = await sampleFn.json(
      "This photo shows a vehicle license plate and/or a VIN plate. Read any license plate number, any VIN (17 characters), and the vehicle make/model/year if visible. " +
      'Reply with ONLY a JSON object like {"plate":"ABC1234","state":"TX","vin":"1FTFW1ET5DFA12345","makeModel":"Ford F-150 2019"}. ' +
      "Use an empty string for anything you cannot read clearly. Do not guess.",
      {images: blob, modelTier: "default"}
    );
    const bits = [];
    if(result.plate) bits.push(result.state ? `${result.state} ${result.plate}` : result.plate);
    if(result.vin) bits.push(`VIN ${result.vin}`);
    if(bits.length){
      document.getElementById("f-vehicle").value = bits.join(" · ");
    }
    if(result.makeModel && !document.getElementById("f-makeModel").value){
      document.getElementById("f-makeModel").value = result.makeModel;
    }
    if(result.vin) document.getElementById("f-vin").value = String(result.vin).toUpperCase();
    status.textContent = bits.length
      ? "✓ Filled in — check it's correct"
      : "Couldn't read it clearly. Try a closer, brighter photo.";
  }catch(err){
    const code = err && err.code;
    if(code === "not_granted" || code === "sampling_disabled"){
      status.textContent = "Photo reading needs permission — allow it and try again.";
    } else if(code === "rate_limited"){
      status.textContent = "Too many scans right now. Wait a moment and retry.";
    } else {
      status.textContent = "Couldn't read the photo. Try again or type it in.";
    }
    console.error(err);
  } finally {
    if(btn) btn.disabled = false;
  }
}

let lastEstimatedFrom = "";

async function estimateTowMiles(auto){
  const from = document.getElementById("f-pickupLocation").value.trim();
  const to = (shopInfo.address || "").trim();
  const note = document.getElementById("mapNote");
  const btn = document.getElementById("estMilesBtn");

  if(auto){
    // only once the address looks real, and never over a figure typed by hand
    if(from.length < 8 || !/\d/.test(from)) return;
    if(from === lastEstimatedFrom) return;
    if(!to || !sampleFn) return;
    if(document.getElementById("f-towMiles").value.trim() !== "") return;
    lastEstimatedFrom = from;
  } else {
    if(!from){ note.textContent = "Type the pickup address first."; return; }
    if(!to){ note.innerHTML = 'Add your shop address in <strong>Shop Info</strong> first.'; return; }
    if(!sampleFn){ note.textContent = "Estimating isn't available here \u2014 read the miles off the map."; return; }
    lastEstimatedFrom = from;
  }

  btn.disabled = true;
  note.textContent = "Working out the distance\u2026";
  try{
    const r = await sampleFn.json(
      "Estimate the DRIVING distance in miles between these two US addresses. " +
      'Reply with ONLY {"miles":0,"confident":true}. miles is a number, one decimal place. ' +
      "Set confident to false if either address is vague or you are unsure. Do not explain.\n" +
      "From: " + from + "\nTo: " + to,
      { modelTier: "default" }
    );
    const mi = Number(r && r.miles);
    if(!isFinite(mi) || mi <= 0){
      note.textContent = "Couldn't work that one out \u2014 read it off the map.";
      return;
    }
    document.getElementById("f-towMiles").value = mi.toFixed(1);
    milesEstimated = true;
    applyMilesFlag();
    updateGrandTotal();
    note.innerHTML = (r.confident === false)
      ? `<span style="color:#dc2626;font-weight:600;">UNVERIFIED guess: ${mi.toFixed(1)} mi \u2014 open Map, then press \u2713 Verified.</span>`
      : `<span style="color:#dc2626;font-weight:600;">UNVERIFIED guess: ${mi.toFixed(1)} mi \u2014 open Map, then press \u2713 Verified.</span>`;
  }catch(err){
    note.textContent = "Couldn't work that one out \u2014 read it off the map.";
  } finally {
    btn.disabled = false;
  }
}

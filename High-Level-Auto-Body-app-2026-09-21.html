// ---------- Live pickup-address suggestions ----------
let addrTimer = null, addrSeq = 0;
const addrCache = {};

function pastPickups(){
  return [...new Set(
    trucks.filter(t=>!t.deleted && t.pickupLocation)
          .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))
          .map(t=>t.pickupLocation.trim())
  )];
}

function hideAddrSuggest(){ document.getElementById("addrSuggest").style.display = "none"; }

function drawAddrSuggest(mine, guessed){
  const box = document.getElementById("addrSuggest");
  const row = (text, tag, colour) => `
    <div data-addr="${escapeHtml(text)}" style="padding:9px 11px;cursor:pointer;border-bottom:1px solid var(--border);
         display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.85rem;">
      <span style="flex:1;min-width:0;">${escapeHtml(text)}</span>
      <span style="font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:${colour};
                   white-space:nowrap;">${tag}</span>
    </div>`;

  const html = mine.map(a=>row(a,"used before","var(--ready)")).join("")
             + guessed.map(a=>row(a,"suggestion","var(--muted)")).join("");
  if(!html){ hideAddrSuggest(); return; }
  box.innerHTML = html;
  box.style.display = "block";
  box.querySelectorAll("[data-addr]").forEach(el=>{
    el.addEventListener("mousedown", (e)=>{      // mousedown beats the input losing focus
      e.preventDefault();
      const inp = document.getElementById("f-pickupLocation");
      inp.value = el.getAttribute("data-addr");
      hideAddrSuggest();
      refreshMapLink(); refreshRouteLine();
      estimateTowMiles(true);
    });
  });
}

async function suggestAddresses(){
  const inp = document.getElementById("f-pickupLocation");
  const q = inp.value.trim();
  if(q.length < 3){ hideAddrSuggest(); return; }

  const ql = q.toLowerCase();
  const mine = pastPickups().filter(a=>a.toLowerCase().includes(ql)).slice(0,4);
  drawAddrSuggest(mine, addrCache[ql] || []);

  if(addrCache[ql] || !sampleFn) return;

  const seq = ++addrSeq;
  try{
    const r = await sampleFn.json(
      "A tow truck driver is typing a pickup location near Monticello, New York (Sullivan County). " +
      'Suggest up to 5 real, complete addresses or place names that match what they have typed so far. ' +
      'Reply with ONLY {"addresses":["",""]} formatted "Street or Place, City, ST ZIP". ' +
      "Use real roads, highway exits and towns in that area. Never invent a house number they did not type " +
      "\u2014 if they typed no number, suggest the road or place without one. Typed so far: " + q,
      { modelTier: "quick", cache: {gcTime: 600000} }
    );
    const list = Array.isArray(r && r.addresses) ? r.addresses.filter(x=>typeof x === "string" && x.trim()) : [];

  // drag by the grip (mouse + touch via pointer events)
  wrap.querySelectorAll("[data-pgrip]").forEach(g=>{

      const from = +g.dataset.pgrip;
      const rows = [...wrap.querySelectorAll("[data-prow]")];
      const dragRow = rows[from];

      let target = from;
      dragRow.classList.add("p-dragging");

      const onMove = ev=>{
        dragRow.style.transform = `translateY(${ev.clientY - startY}px)`;
        target = from;
        rows.forEach((r,idx)=>{
          if(idx === from) return;
          const rc = r.getBoundingClientRect(), mid = rc.top + rc.height/2;
          if(idx < from && ev.clientY < mid) target = Math.min(target, idx);
          if(idx > from && ev.clientY > mid) target = Math.max(target, idx);
        });
        rows.forEach((r,idx)=>r.classList.toggle("p-drop", idx === target && target !== from));
      };
      const onUp = ()=>{
        g.removeEventListener("pointermove", onMove);

        dragRow.classList.remove("p-dragging");
        rows.forEach(r=>r.classList.remove("p-drop"));

      };
      g.addEventListener("pointermove", onMove);
      g.addEventListener("pointerup", onUp);
      g.addEventListener("pointercancel", onUp);
    });
  });

      partsList.splice(i,1);

      updatePartsSubtotal();
      updateGrandTotal();
    });
  });

}

function partQty(p){
  const q = parseInt(p && p.qty, 10);

}
function partLabel(p){
  const q = partQty(p);
  const name = (p && p.name) || "—";
  return q > 1 ? q + " × " + name : name;
}
function partLineLabel(p){
  const q = partQty(p);
  const each = parseFloat(p && p.price) || 0;
  if(!each) return "";
  if(q <= 1) return "$" + each.toFixed(2);
  return q + " × $" + each.toFixed(2) + " = <strong style=\"color:var(--text);\">$" + (q*each).toFixed(2) + "</strong>";
}
function partsListTotal(list){

    ? (parseFloat(document.getElementById("f-diagFee").value) || 0) : 0;
  const extras = (typeof formExtrasTotal === "function") ? formExtrasTotal() : 0;
  const subtotal = parts + labor + tow + diag + extras;
  const taxOn = document.getElementById("f-chargeTax").checked;
  const tax = taxOn ? subtotal * 0.08 : 0;
  document.getElementById("taxLabel").textContent = taxOn ? "Tax (8%)" : "No tax";
  document.getElementById("totalLabel").textContent = taxOn ? "Total (after tax)" : "Total (no tax)";
  document.getElementById("subtotalValue").textContent = "$" + subtotal.toFixed(2);
  document.getElementById("taxValue").textContent = "$" + tax.toFixed(2);
  document.getElementById("grandTotalValue").textContent = "$" + (subtotal + tax).toFixed(2);
  window._formTotal = subtotal + tax;
  const _fee = (typeof formFee === "function") ? formFee() : 0;
  const fr = document.getElementById("feeRow");
  fr.style.display = _fee > 0 ? "flex" : "none";
  document.getElementById("feeValue").textContent = "$" + _fee.toFixed(2);
  document.getElementById("grandTotalValue").textContent = "$" + (subtotal + tax + _fee).toFixed(2);
  if(_fee > 0) document.getElementById("totalLabel").textContent = "Total (with card fee)";
  if(typeof payMode === "function" && payMode() === "Split") splitRecalc();
  const bits = [];
  if(parts) bits.push(`Parts $${parts.toFixed(2)}`);
  if(labor) bits.push(`Labor ${laborHours}hr $${labor.toFixed(2)}`);
  if(tow) bits.push(`Tow $${tow.toFixed(2)}`);
  if(diag) bits.push(`Diagnosis $${diag.toFixed(2)}`);
  if(extras) bits.push(`Other charges $${extras.toFixed(2)}`);
  document.getElementById("grandTotalBreakdown").textContent = bits.join(" + ");
  updateBalanceDue();
}

const _myWrites = new Map();              // job id -> time this device last wrote it
function markMine(id){ _myWrites.set(id, Date.now()); }
function isMine(id){ const t = _myWrites.get(id); return !!t && Date.now() - t < 3500; }

let _audioCtx = null;
function unlockAudio(){
  try{
    if(!_audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) _audioCtx = new AC(); }
    if(_audioCtx && _audioCtx.state === "suspended") _audioCtx.resume();
  }catch(e){}
}
["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev, unlockAudio, {passive:true}));
function playDing(){
  try{
    unlockAudio();
    const ctx = _audioCtx; if(!ctx) return;
    const now = ctx.currentTime;
    [[880,0],[1318.5,0.14]].forEach(([freq, at])=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, now+at);
      g.gain.exponentialRampToValueAtTime(0.35, now+at+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now+at+0.45);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+at); o.stop(now+at+0.5);
    });
  }catch(e){}
}

  const kill = ()=>{ card.classList.add("out"); setTimeout(()=>card.remove(), 250); };
  card.querySelector(".alert-x").addEventListener("click", e=>{ e.stopPropagation(); kill(); });

  setTimeout(kill, 9000);
}

const _SIG_FIELDS = [
  ["customer", t=>t.customer], ["phone", t=>t.phone], ["issue", t=>t.issue], ["make/model", t=>t.makeModel],
  ["plate", t=>t.vehicle], ["VIN", t=>t.vin], ["parts", t=>t.partsList], ["labor", t=>t.laborHours],
  ["invoice lines", t=>t.extraItems], ["towing", t=>[t.towed,t.towCost,t.towMiles,t.pickupLocation]],
  ["diagnosis", t=>[t.diagCharge,t.diagFee,t.diagWaived]], ["tax", t=>t.noTax], ["card fee", t=>t.cardFee],
  ["notes", t=>t.notes], ["job type", t=>t.jobType], ["schedule", t=>[t.scheduled,t.scheduledTime]],
  ["warranty", t=>t.warrantyMonths], ["invoice dates", t=>[t.invoiceDate,t.dueDate]], ["invoice #", t=>t.invSeries===3 ? t.invoiceNum : ""]
];
function _jobSig(t){
  const o = {};
  _SIG_FIELDS.forEach(([k,get])=>{ let v; try{ v = JSON.stringify(get(t) ?? ""); }catch(e){ v = ""; } o[k] = v; });
  return o;
}
function _sigDiff(a, b){
  if(!a || !b) return [];
  return _SIG_FIELDS.map(([k])=>k).filter(k=>a[k] !== b[k]);
}
function checkStatusChanges(newTrucks){
  const current = {};
  newTrucks.forEach(t=>{
    current[t.id] = {status:t.status, name:(t.makeModel ? t.makeModel + " · " + t.vehicle : (t.vehicle || "Job")),
      archived:!!t.archived, deleted:!!t.deleted, paid:Number(t.paid)||0, method:payMethodText ? payMethodText(t) : (t.paymentMethod||""), sig:_jobSig(t)};
  });
  if(lastStatuses){
    Object.keys(current).forEach(id=>{
      const prev = lastStatuses[id], now = current[id];
      if(isMine(id)) return;
      if(!prev){ notifyStatusChange(`New job added: ${now.name}`, "\u{1F697}", id); return; }
      if(!prev.deleted && now.deleted){ notifyStatusChange(`${now.name} moved to Trash`, "\u{1F5D1}️"); return; }
      if(prev.deleted && !now.deleted){ notifyStatusChange(`${now.name} restored from Trash`, "♻️", id); return; }
      if(!prev.archived && now.archived){ notifyStatusChange(`${now.name} was archived`, "\u{1F4E6}"); return; }
      if(prev.status !== now.status){
        const label = (STATUSES.find(s=>s.id===now.status)||{}).label || now.status;
        notifyStatusChange(`${now.name} → ${label}`, now.status === "ready" ? "✅" : "\u{1F504}", id);
        return;
      }
      if(now.paid > prev.paid + 0.004){
        notifyStatusChange(`Payment $${(now.paid - prev.paid).toFixed(2)}${now.method ? " · " + now.method : ""} — ${now.name}`, "\u{1F4B5}", id);
        return;
      }
      const changed = _sigDiff(prev.sig, now.sig);
      if(changed.length) notifyStatusChange(`${now.name} \u2014 changed: ${changed.join(", ")}`, "\u270F\uFE0F", id);
    });
    Object.keys(lastStatuses).forEach(id=>{
      if(!current[id] && !isMine(id)) notifyStatusChange(`${lastStatuses[id].name} was deleted`, "\u{1F5D1}️");
    });
  }
  lastStatuses = current;
}

function updateBalanceDue(){
  const parts = currentPartsCost();
  const laborHours = currentLaborHours();
  const tow = document.getElementById("f-towed").checked ? (parseFloat(document.getElementById("f-towCost").value) || 0) : 0;
  const total = ((typeof window._formTotal === "number") ? window._formTotal
    : (parts + laborHours*LABOR_RATE + tow) * (document.getElementById("f-chargeTax").checked ? 1.08 : 1))
    + ((typeof formFee === "function") ? formFee() : 0);
  const paid = parseFloat(document.getElementById("f-paid").value) || 0;
  document.getElementById("f-paymentStatus").value = paid <= 0 ? "unpaid" : (total > 0 && paid >= total - 0.005 ? "paid" : "partial");
  const bal = total - paid;
  const el = document.getElementById("balanceDue");
  if(total <= 0){ el.textContent = ""; return; }
  if(bal <= 0.005){
    el.innerHTML = `<span style="color:var(--ready);">Paid in full ✓</span>`;
  } else {
    el.innerHTML = `Balance due: <span style="color:#dc2626;">$${bal.toFixed(2)}</span>${paid ? ` <span style="color:var(--muted);font-weight:500;">(paid $${paid.toFixed(2)} of $${total.toFixed(2)})</span>` : ""}`;
  }
}
document.getElementById("f-paid").addEventListener("input", updateBalanceDue);
function payMode(){
  const r = document.querySelector('input[name="payMethod"]:checked');
  return r ? r.value : "";
}
function formTotalNow(){ return (typeof window._formTotal === "number") ? window._formTotal : 0; }
function feeOn(){ const m = payMode(); return (m === "Card" || m === "Split") && document.getElementById("f-cardFee").checked; }
function formFee(){
  if(!feeOn()) return 0;
  if(payMode() === "Card") return r2(formTotalNow() * CARD_FEE);
  const d = parseFloat(document.getElementById("f-payCardAmt").value) || 0;
  return r2(d * CARD_FEE / (1 + CARD_FEE));
}
function refreshFeeLabel(){
  const m = payMode();
  document.getElementById("feeWrap").style.display = (m === "Card" || m === "Split") ? "" : "none";
  const fee = formFee();
  document.getElementById("feeAmtLbl").textContent = fee > 0 ? "+$" + fee.toFixed(2) : "";
}
function r2(n){ return Math.round((Number(n)||0)*100)/100; }
function syncPayUI(){
  const m = payMode();
  const split = m === "Split";
  document.getElementById("splitBox").style.display = split ? "" : "none";
  document.getElementById("paidWrap").style.display = split ? "none" : "";
  document.getElementById("f-paymentMethod").value = split ? "Cash + Card" : m;
  if(split) splitRecalc();
  updateGrandTotal();
  refreshFeeLabel();
}
function splitRecalc(){
  const c = parseFloat(document.getElementById("f-payCashAmt").value) || 0;
  const d = parseFloat(document.getElementById("f-payCardAmt").value) || 0;
  document.getElementById("f-paid").value = (c + d) ? r2(c + d).toFixed(2) : "";
  const k = feeOn() ? (1 + CARD_FEE) : 1;
  const left = r2(formTotalNow() - c - d / k);
  const info = document.getElementById("splitInfo");
  if(formTotalNow() <= 0) info.textContent = "";
  else if(Math.abs(left) < 0.005) info.innerHTML = `<span style="color:var(--ready);">Covers $${formTotalNow().toFixed(2)}${k>1 ? " + $" + r2(d - d/k).toFixed(2) + " card fee" : ""} ✓</span>`;
  else if(left > 0) info.innerHTML = `Still to pay: <span style="color:#dc2626;">$${left.toFixed(2)}</span>${k>1?" + card fee":""}`;
  else info.innerHTML = `<span style="color:#d97706;">$${(-left).toFixed(2)} more than the total</span>`;
}
document.querySelectorAll('input[name="payMethod"]').forEach(r=>r.addEventListener("change", ()=>{
  const pm = payMode();
  document.getElementById("f-cardFee").checked = (pm === "Card" || pm === "Split");
  if(payMode() === "Split"){
    const paid = parseFloat(document.getElementById("f-paid").value) || 0;
    const ca = document.getElementById("f-payCashAmt"), cd = document.getElementById("f-payCardAmt");
    if(!ca.value && !cd.value && paid) ca.value = r2(paid).toFixed(2);
  }
  if(typeof formDirty !== "undefined") formDirty = true;
  syncPayUI();
}));
[["f-payCashAmt","f-payCardAmt"],["f-payCardAmt","f-payCashAmt"]].forEach(([me, other])=>{
  document.getElementById(me).addEventListener("input", ()=>{
    const v = parseFloat(document.getElementById(me).value);
    const tot = formTotalNow();
    const k = feeOn() ? (1 + CARD_FEE) : 1;
    if(tot > 0 && isFinite(v)){
      const val = me === "f-payCashAmt" ? Math.max(0, (tot - v) * k) : Math.max(0, tot - v / k);
      document.getElementById(other).value = r2(val).toFixed(2);
    }
    if(typeof formDirty !== "undefined") formDirty = true;
    splitRecalc(); updateGrandTotal(); refreshFeeLabel();
  });
});
document.getElementById("f-cardFee").addEventListener("change", ()=>{
  if(payMode() === "Split"){
    // keep the cash part, re-figure the card part with / without the fee
    const tot = formTotalNow();
    const c = parseFloat(document.getElementById("f-payCashAmt").value) || 0;
    const k = feeOn() ? (1 + CARD_FEE) : 1;
    if(tot > 0) document.getElementById("f-payCardAmt").value = r2(Math.max(0, (tot - c) * k)).toFixed(2);
    splitRecalc();
  }
  if(typeof formDirty !== "undefined") formDirty = true;
  updateGrandTotal(); refreshFeeLabel();
});
document.getElementById("splitHalfBtn").addEventListener("click", ()=>{
  const tot = formTotalNow();
  if(tot <= 0) return;
  const half = r2(tot/2);
  const k = feeOn() ? (1 + CARD_FEE) : 1;
  document.getElementById("f-payCashAmt").value = half.toFixed(2);
  document.getElementById("f-payCardAmt").value = r2((tot - half) * k).toFixed(2);
  if(typeof formDirty !== "undefined") formDirty = true;
  splitRecalc(); updateGrandTotal(); refreshFeeLabel();
});
document.getElementById("payFullBtn").addEventListener("click", ()=>{
  const tot = formTotalNow();
  if(tot <= 0) return;
  document.getElementById("f-paid").value = r2(tot + formFee()).toFixed(2);
  if(typeof formDirty !== "undefined") formDirty = true;
  updateBalanceDue();
});

// ---- Days in shop ----
function actualSeconds(t){
  let sec = t.actualSeconds || 0;
  if(t.timerStart) sec += Math.floor((Date.now() - t.timerStart)/1000);
  return sec;
}
function fmtDuration(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), ss = sec%60;
  return `${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
}
function quotedHours(t){
  if(hasWorkItems(t)) return approvedWork(t).reduce((n,w)=>n+(parseFloat(w.hours)||0),0);
  return t.laborHours ? Number(t.laborHours) : 0;
}

function daysInShop(t){
  if(!t.createdAt) return 0;
  return Math.floor((Date.now() - t.createdAt) / 86400000);
}
function daysBadge(t){
  if(t.status === "done" || t.archived) return "";
  const d = daysInShop(t);
  if(d < 1) return `<span style="color:var(--muted);font-size:.76rem;">today</span>`;
  const color = d >= 14 ? "#dc2626" : (d >= 7 ? "#d97706" : "var(--muted)");
  return `<span style="color:${color};font-size:.76rem;font-weight:600;">${d} day${d>1?"s":""} in shop</span>`;
}

function isoDay(d){ const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function longDate(iso){ try{ return new Date(iso+"T00:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}); }catch(e){ return iso; } }
function money(n){ return "$" + (Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2}); }
function defaultDue(t, invIso){
  const d = new Date(invIso+"T00:00:00");
  if(t.jobType === "Insurance") d.setDate(d.getDate()+12);
  return isoDay(d);
}

// Invoice numbering (fresh start): 001, 002, 003 ... Only numbers issued in this series (invSeries === 3) count.
function hasInvNum(t){ return !!(t && t.invSeries === 3 && String(t.invoiceNum||"").trim()); }
function invNum(t){ return hasInvNum(t) ? String(t.invoiceNum).trim() : ""; }
let _invPending = new Set(), _invLast = 0;
function allocInvoiceNumber(){
  const n = Math.max(parseInt(nextInvoiceNumber(),10), _invLast + 1);
  _invLast = n;
  return String(n).padStart(3,"0");
}
function backfillInvoiceNumbers(){
  if(document.body.classList.contains("readonly")) return;
  const need = trucks.filter(t=>!t.deleted && !hasInvNum(t) && !_invPending.has(t.id))
    .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  need.forEach(t=>{
    _invPending.add(t.id);
    Promise.resolve(updateTruck(t.id, {invoiceNum: allocInvoiceNumber(), invSeries: 3})).catch(e=>console.error(e));
  });
}
function nextInvoiceNumber(){
  let max = 0;
  trucks.forEach(t=>{
    if(!hasInvNum(t)) return;
    const n = parseInt(String(t.invoiceNum).replace(/\D/g,""),10);
    if(isFinite(n)) max = Math.max(max, n);
  });
  return String(max + 1).padStart(3, "0");
}

function patchJob(t, patch){
  try{ Object.assign(t, patch); }catch(e){}
  const live = trucks.find(x=>x.id===t.id);
  if(live && live !== t && !Object.isFrozen(live)){ try{ Object.assign(live, patch); }catch(e){} }
  Promise.resolve().then(()=>updateTruck(t.id, patch)).catch(e=>console.error(e));
}

function ensureInvoiceMeta(t){
  const patch = {};
  if(!hasInvNum(t)){ patch.invoiceNum = allocInvoiceNumber(); patch.invSeries = 3; _invPending.add(t.id); }
  if(!t.invoiceDate) patch.invoiceDate = isoDay(Date.now());
  if(!t.dueDate) patch.dueDate = defaultDue(t, patch.invoiceDate || t.invoiceDate);
  if(Object.keys(patch).length) patchJob(t, patch);
}

function invoiceLines(t){
  const L = [];
  const approved = hasWorkItems(t) ? approvedWork(t) : [];
  if(approved.length){
    approved.forEach(w=>{
      const amt = (parseFloat(w.parts)||0) + (parseFloat(w.hours)||0)*LABOR_RATE;
      L.push({name:w.desc||"Work", desc: w.hours ? `${Number(w.hours)} hr @ $${LABOR_RATE}/hr` : "", qty:1, price:amt});
    });
  } else {
    if(t.partsList && t.partsList.length){
      t.partsList.filter(p=>p.name||p.price).forEach(p=>{
        L.push({name:p.name||"Part", desc:p.store||"", qty:partQty(p), price:parseFloat(p.price)||0});
      });
    } else if(!t.partsSaved && t.estimate && Number(t.estimate)){
      L.push({name:"Parts", desc:"", qty:1, price:Number(t.estimate)});
    }
    if(t.laborHours && Number(t.laborHours)){
      L.push({name:"Labor", desc:"Mechanic", qty:Number(t.laborHours), price:LABOR_RATE});
    }
  }
  if(t.quickAmount && Number(t.quickAmount)) L.push({name:t.issue||"Service", desc:"", qty:1, price:Number(t.quickAmount)});
  if(t.towed && t.towCost && Number(t.towCost)){
    const route = t.pickupLocation ? `${t.pickupLocation} to shop${t.towMiles ? " · " + Number(t.towMiles) + " mi" : ""}` : "";
    L.push({name:"Towing", desc:route, qty:1, price:Number(t.towCost), warn: t.milesEstimated ? "MILEAGE UNVERIFIED — confirm before sending" : ""});
  }
  if(t.diagCharge && t.diagFee && Number(t.diagFee)){
    L.push(t.diagWaived
      ? {name:"Diagnosis", desc:"Waived — repair approved", qty:1, price:0}
      : {name:"Diagnosis", desc:"", qty:1, price:Number(t.diagFee)});
  }
  (t.extraItems||[]).forEach(x=>{
    if(!(x.name || Number(x.price))) return;
    L.push({name:x.name||"Item", desc:x.desc||"", qty:parseFloat(x.qty)||0, price:parseFloat(x.price)||0});
  });
  L.forEach(l=>{ l.amount = (Number(l.qty)||0) * (Number(l.price)||0); });
  return L;
}
function fmtQty(q){ q = Number(q)||0; return Number.isInteger(q) ? String(q) : String(Math.round(q*100)/100); }

    </div>`}
  `;
  if(!readonly) wireInvoiceControls(t);
}

function wireInvoiceControls(t){
  const box = document.getElementById("iv-extras");
  const items = (t.extraItems||[]).map(x=>({...x}));
  const save = async ()=>{ await patchJob(t, {extraItems: items.map(x=>({...x}))}); renderInvoice(t); };
  box.innerHTML = items.length ? items.map((x,i)=>`
    <div class="iv-xrow">
      <input data-xi="${i}" data-xf="name" placeholder="Item" value="${escapeHtml(x.name||"")}">
      <input data-xi="${i}" data-xf="desc" placeholder="Details (optional)" value="${escapeHtml(x.desc||"")}">
      <input data-xi="${i}" data-xf="qty" type="number" inputmode="decimal" step="any" min="0" placeholder="Qty" value="${x.qty??""}">
      <input data-xi="${i}" data-xf="price" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Price" value="${x.price??""}">
      <button type="button" data-xdel="${i}" title="Remove">✕</button>
    </div>`).join("") : `<div style="font-size:.78rem;color:#888;margin-bottom:6px;">None yet — tap a button below to add one.</div>`;
  box.querySelectorAll("[data-xi]").forEach(inp=>inp.addEventListener("change", ()=>{
    items[+inp.dataset.xi][inp.dataset.xf] = inp.value; save();
  }));
  box.querySelectorAll("[data-xdel]").forEach(b=>b.addEventListener("click", ()=>{ items.splice(+b.dataset.xdel,1); save(); }));
  document.querySelectorAll("[data-chip]").forEach(b=>b.addEventListener("click", ()=>{
    const c = EXTRA_CHIPS[+b.dataset.chip];
    const item = c ? {name:c.name, desc:c.desc, qty:1, price:c.price} : {name:"", desc:"", qty:1, price:""};
    if(c && c.name === "Storage" && t.createdAt){
      const a0 = new Date(t.createdAt); a0.setHours(0,0,0,0);
      const b0 = new Date(); b0.setHours(0,0,0,0);
      const days = Math.max(1, Math.round((b0 - a0)/86400000) + 1);
      item.qty = days;
      item.desc = `From ${new Date(t.createdAt).toLocaleDateString("en-US")} to ${new Date().toLocaleDateString("en-US")}`;
    }
    if(c && c.name === "Tow mileage" && t.towMiles) item.qty = Number(t.towMiles);
    items.push(item); save();
  }));
  const numInp = document.getElementById("iv-num"), numMsg = document.getElementById("iv-numMsg");
  const dupOf = v=> trucks.find(x=>x.id !== t.id && !x.deleted && invNum(x) === v);
  const showDup = v=>{
    const d = v && dupOf(v);
    numMsg.innerHTML = d ? `<span style="color:#dc2626;font-weight:700;">Invoice ${escapeHtml(v)} is already used by ${escapeHtml(d.makeModel || d.vehicle || "another job")}</span>` : "";
  };
  showDup(invNum(t));
  numInp.addEventListener("input", ()=>{ let v = numInp.value.trim(); if(/^\d{1,2}$/.test(v)) v = v.padStart(3,"0"); showDup(v); });
  numInp.addEventListener("change", ()=>{
    let v = numInp.value.trim().replace(/^#/,"");
    if(!v){ numInp.value = invNum(t); return; }
    if(/^\d{1,2}$/.test(v)) v = v.padStart(3,"0");
    patchJob(t, {invoiceNum: v, invSeries: 3});
    renderInvoice(t);
    const m = document.getElementById("iv-numMsg");
    if(m && !m.textContent) m.innerHTML = `<span style="color:var(--ready);font-weight:700;">Saved \u2713</span>`;
  });
  document.getElementById("iv-tax").addEventListener("change", e=>{ patchJob(t, {noTax: !e.target.checked}); renderInvoice(t); });
  const d1 = document.getElementById("iv-date"), d2 = document.getElementById("iv-due");
  d1.addEventListener("change", async ()=>{
    if(!d1.value) return;
    const wasReceipt = (t.dueDate||"") === (t.invoiceDate||"");
    const patch = {invoiceDate: d1.value};
    if(wasReceipt || (t.dueDate && t.dueDate < d1.value)) patch.dueDate = d1.value;
    await patchJob(t, patch); renderInvoice(t);
  });
  d2.addEventListener("change", async ()=>{ if(!d2.value) return; await patchJob(t, {dueDate: d2.value}); renderInvoice(t); });
  document.getElementById("iv-receipt").addEventListener("click", async ()=>{ await patchJob(t, {dueDate: t.invoiceDate}); renderInvoice(t); });
  document.getElementById("iv-12").addEventListener("click", async ()=>{
    const d = new Date((t.invoiceDate||isoDay(Date.now()))+"T00:00:00"); d.setDate(d.getDate()+12);
    await patchJob(t, {dueDate: isoDay(d)}); renderInvoice(t);
  });
}

/* ---------------- tiny PDF writer (no libraries) ---------------- */
const HELV_W = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const HELVB_W = [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
const WINANSI = {0x2014:0x97,0x2013:0x96,0x2022:0x95,0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2026:0x85,0x20AC:0x80,0x2192:0x3E};
function pdfEnc(str){
  let o = "";
  for(const ch of String(str)){
    let c = ch.codePointAt(0);
    if(WINANSI[c] !== undefined) c = WINANSI[c];
    else if(c > 255) c = 0x3F;
    o += String.fromCharCode(c);
  }
  return o;
}
function pdfTextW(str, bold, size){
  const W = bold ? HELVB_W : HELV_W;
  let w = 0;
  for(const ch of pdfEnc(str)){ const c = ch.charCodeAt(0); w += (c>=32 && c<=126) ? W[c-32] : 556; }
  return w * size / 1000;
}
function pdfWrap(str, bold, size, maxW){
  const words = String(str||"").split(/\s+/).filter(Boolean);
  const out = []; let cur = "";
  words.forEach(w=>{
    const t = cur ? cur + " " + w : w;
    if(pdfTextW(t, bold, size) <= maxW || !cur) cur = t; else { out.push(cur); cur = w; }
  });
  if(cur) out.push(cur);
  return out.length ? out : [""];
}
function hexRGB(h){ h=h.replace("#",""); return [0,2,4].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(" "); }

function PdfDoc(){
  const H = 792;
  const pages = []; let cur = null;
  const esc = s => pdfEnc(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
  const api = {
    W: 612, H,
    addPage(){ cur = []; pages.push(cur); return api; },
    text(str, x, y, o={}){
      const size = o.size||9, bold = !!o.bold;
      let tx = x;
      if(o.align === "right") tx = x - pdfTextW(str, bold, size);
      else if(o.align === "center") tx = x - pdfTextW(str, bold, size)/2;
      cur.push(`BT /${bold?"F2":"F1"} ${size} Tf ${hexRGB(o.color||"#222222")} rg ${tx.toFixed(2)} ${(H-y).toFixed(2)} Td (${esc(str)}) Tj ET`);
      return api;
    },
    rect(x, y, w, h, color){ cur.push(`${hexRGB(color)} rg ${x.toFixed(2)} ${(H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); return api; },
    line(x1, y1, x2, y2, color, width){ cur.push(`${hexRGB(color||"#dddddd")} RG ${(width||0.75)} w ${x1.toFixed(2)} ${(H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(H-y2).toFixed(2)} l S`); return api; },
    image(img, x, y, w, h){ if(img) cur.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${(H-y-h).toFixed(2)} cm /Im1 Do Q`); return api; },
    build(img, opts){
      opts = opts || {};
      const enc = new TextEncoder();
      const chunks = []; let len = 0; const offs = [];
      const pushStr = s => { const b = new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i] = s.charCodeAt(i) & 255; chunks.push(b); len += b.length; };
      const pushBin = b => { chunks.push(b); len += b.length; };
      pushStr("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
      const n = pages.length;
      // object ids: 1 catalog, 2 pages, 3 F1, 4 F2, 5 image, then page/content pairs
      const pageId = i => 6 + i*2, contId = i => 7 + i*2;
      const obj = (id, body) => { offs[id] = len; pushStr(`${id} 0 obj\n${body}\nendobj\n`); };
      const actId = 6 + pages.length*2;
      obj(1, opts.autoPrint ? `<< /Type /Catalog /Pages 2 0 R /OpenAction ${actId} 0 R >>` : "<< /Type /Catalog /Pages 2 0 R >>");
      obj(2, `<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>pageId(i)+" 0 R").join(" ")}] >>`);
      obj(3, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
      obj(4, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
      offs[5] = len;
      if(img){
        pushStr(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${img.w} /Height ${img.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.bytes.length} >>\nstream\n`);
        pushBin(img.bytes); pushStr("\nendstream\nendobj\n");
      } else pushStr("5 0 obj\nnull\nendobj\n");
      pages.forEach((ops,i)=>{
        obj(pageId(i), `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${img?" /XObject << /Im1 5 0 R >>":""} >> /Contents ${contId(i)} 0 R >>`);
        const stream = ops.join("\n");
        obj(contId(i), `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
      });
      let total = 6 + n*2;
      if(opts.autoPrint){
        obj(actId, "<< /Type /Action /S /JavaScript /JS (this.print\\({bUI:true,bSilent:false,bShrinkToFit:true}\\);) >>");
        total += 1;
      }
      const xref = len;
      let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
      for(let i=1;i<total;i++) x += String(offs[i]||0).padStart(10,"0") + " 00000 n \n";
      pushStr(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
      const out = new Uint8Array(len); let p = 0; chunks.forEach(c=>{ out.set(c,p); p += c.length; });
      return out;
    }
  };
  return api.addPage();
}

function addrLines(a){
  const parts = String(a||"").split(",").map(x=>x.trim()).filter(Boolean);
  if(parts.length <= 1) return parts;
  return [parts[0], parts.slice(1).join(", ")];
}
let _printLogo = null;
function makePrintLogo(){
  if(_printLogo) return _printLogo;
  const img = document.querySelector(".topbar img");
  if(!img || !img.naturalWidth) return null;
  try{
    const scale = Math.min(1, 700 / img.naturalWidth);
    const w = Math.round(img.naturalWidth*scale), h = Math.round(img.naturalHeight*scale);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); g.drawImage(img,0,0,w,h);
    const d = g.getImageData(0,0,w,h), px = d.data;
    // Header logo is light-on-dark. For paper: dark/neutral pixels -> white, light neutral text -> near-black, orange stays.
    for(let i=0;i<px.length;i+=4){
      const a = px[i+3]/255;
      let r = px[i]*a + 255*(1-a), gg = px[i+1]*a + 255*(1-a), b = px[i+2]*a + 255*(1-a);
      if(px[i+3] < 10){ r = gg = b = 255; }
      else {
        const mx = Math.max(px[i],px[i+1],px[i+2]), mn = Math.min(px[i],px[i+1],px[i+2]);
        if(mx - mn < 40){               // neutral grey -> invert
          const v = 255 - (px[i]+px[i+1]+px[i+2])/3;
          const vv = v*a + 255*(1-a);
          r = gg = b = Math.min(255, vv < 128 ? vv*0.35 : vv);
        }
      }
      px[i]=r; px[i+1]=gg; px[i+2]=b; px[i+3]=255;
    }
    g.putImageData(d,0,0);
    const jpg = c.toDataURL("image/jpeg", 0.92);
    const bin = atob(jpg.split(",")[1]); const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    _printLogo = {w, h, bytes, url: jpg};
    return _printLogo;
  }catch(e){ return null; }
}
function printLogoSrc(){ const l = makePrintLogo(); return l ? l.url : ""; }
function logoJpeg(){ return Promise.resolve(makePrintLogo()); }

async function buildInvoicePdf(t, opts){
  const lines = invoiceLines(t);
  const subtotal = lines.reduce((n,l)=>n+l.amount,0);
  const tax = subtotal*taxRate(t), fee = cardFeeAmt(t), total = subtotal + tax + fee, paid = jobPaid(t), due = Math.max(0, total - paid);
  const invDate = t.invoiceDate || isoDay(Date.now());
  const dueDate = t.dueDate || defaultDue(t, invDate);
  const img = await logoJpeg();
  const doc = PdfDoc();
  const R = 578, L = 36, GRAY = "#555555", DARK = "#222222";

  // header
  if(img){ const lw = 125, lh = lw * img.h / img.w; doc.image(img, L+8, 82, lw, lh); }
  doc.text("INVOICE", R, 70, {size:24, align:"right", color:DARK});
  doc.text("#" + invNum(t), R, 88, {size:12, bold:true, align:"right", color:"#ea6e1e"});
  let y = 106;
  doc.text((shopInfo.name||"High Level Auto Body").toUpperCase(), R, y, {size:8, bold:true, align:"right", color:DARK});
  const shopLines = [shopInfo.email, ...addrLines(shopInfo.address), shopInfo.license ? "Lic # "+shopInfo.license : ""].filter(Boolean);
  shopLines.forEach(s=>{ y += 10.5; doc.text(s, R, y, {size:8, align:"right", color:DARK}); });
  if(shopInfo.phone){ y += 21; doc.text("Mobile: " + shopInfo.phone, R, y, {size:8, align:"right", color:DARK}); }
  y = Math.max(y + 26, 176);
  doc.line(12, y, 600, y, "#dddddd", 0.75);

  // bill to + meta
  const top = y + 26;
  doc.text("Vehicle", L, top, {size:9.5, bold:true, color:"#5b6670"});
  let by = top + 16;
  doc.text(t.makeModel || "-", L, by, {size:9.5, bold:true, color:DARK}); by += 13;
  const vinTxt = jobVin(t);
  if(vinTxt){ doc.text("VIN: " + vinTxt, L, by, {size:8.5, color:DARK}); by += 11; }
  else if(t.vehicle && t.vehicle !== "?"){ doc.text("Plate: " + t.vehicle, L, by, {size:8.5, color:DARK}); by += 11; }

  const lx = 498, vx = 508;
  let my = top;
  [["Invoice Number:", invNum(t)], ["Invoice Date:", longDate(invDate)], ["Payment Due:", dueDate===invDate ? "On receipt" : longDate(dueDate)]].forEach(([k,v])=>{
    doc.text(k, lx, my, {size:8, bold:true, align:"right", color:DARK});
    doc.text(v, vx, my, {size:8, color:DARK});
    my += 15;
  });
  doc.rect(413, my - 11, 187, 21, "#f2f3f4");
  doc.text("Amount Due (USD):", lx, my + 3, {size:8, bold:true, align:"right", color:DARK});
  doc.text(money(due), vx, my + 3, {size:8, bold:true, color:DARK});

  // table
  const colQ = 363, colP = 487, colA = 577;
  const header = (yy)=>{
    doc.rect(12, yy, 588, 29, "#444444");
    doc.text("Items", L, yy + 18.5, {size:9.5, bold:true, color:"#ffffff"});
    doc.text("Quantity", colQ, yy + 18.5, {size:9.5, bold:true, align:"center", color:"#ffffff"});
    doc.text("Price", colP, yy + 18.5, {size:9.5, bold:true, align:"right", color:"#ffffff"});
    doc.text("Amount", colA, yy + 18.5, {size:9.5, bold:true, align:"right", color:"#ffffff"});
    return yy + 29;
  };
  y = header(Math.max(by, my + 20) + 22);
  y += 18;
  if(!lines.length){ doc.text("No charges entered yet", L, y, {size:8.5, color:"#999999"}); y += 22; }
  lines.forEach(l=>{
    const nameLines = pdfWrap(l.name, true, 8, 270);
    const descLines = l.desc ? pdfWrap(l.desc, false, 8.5, 270) : [];
    const need = nameLines.length*11 + descLines.length*12 + (l.warn?11:0) + 14;
    if(y + need > 740){ doc.addPage(); y = header(40) + 18; }
    doc.text(fmtQty(l.qty), colQ, y, {size:8, align:"center", color:DARK});
    doc.text(money(l.price), colP, y, {size:8, align:"right", color:DARK});
    doc.text(money(l.amount), colA, y, {size:8, align:"right", color:DARK});
    nameLines.forEach(s=>{ doc.text(s, L, y, {size:8, bold:true, color:DARK}); y += 11; });
    y += 1;
    descLines.forEach(s=>{ doc.text(s, L, y, {size:8.5, color:GRAY}); y += 12; });
    if(l.warn){ doc.text(l.warn, L, y, {size:7.5, bold:true, color:"#dc2626"}); y += 11; }
    y += 14;
  });
  y -= 6;
  doc.line(12, y, 600, y, "#cfd8e0", 1.5);

  // totals
  if(y + 150 > 760){ doc.addPage(); y = 50; }
  y += 22;
  const tot = (k, v, bold)=>{ doc.text(k, colP, y, {size:8, bold, align:"right", color:DARK}); doc.text(v, colA, y, {size:8, bold, align:"right", color:DARK}); };
  tot("Subtotal:", money(subtotal), true); y += 15;
  tot(t.noTax ? "No sales tax" : "TAX 8%:", money(tax), false); y += 15;
  if(fee > 0){ tot("Card fee 4%:", money(fee), false); y += 15; }
  y += 2;
  doc.line(413, y, 578, y, "#dddddd", 0.75); y += 17;
  tot("Total:", money(total), true); y += 15;
  if(paid > 0){ tot("Paid" + (payMethodText(t) ? " ("+payMethodText(t)+")" : "") + ":", "-" + money(paid), false); y += 15; }
  doc.line(413, y, 578, y, "#cfd8e0", 2.5); y += 17;
  tot("Amount Due (USD):", money(due), true); y += 34;

  const para = (label, txt)=>{
    pdfWrap(label + " " + txt, false, 8.5, 540).forEach((s,i)=>{
      if(y > 750){ doc.addPage(); y = 50; }
      doc.text(s, L, y, {size:8.5, color:GRAY}); y += 12;
    });
    y += 6;
  };
  if(t.notes) para("Notes:", t.notes);
  if(t.warrantyMonths) para("Warranty:", `${t.warrantyMonths} month${t.warrantyMonths=="1"?"":"s"} on this work, through ${new Date(warrantyEnd(t)).toLocaleDateString("en-US")}.`);
  doc.text("Thank you for choosing " + (shopInfo.name||"High Level Auto Body"), 306, Math.max(y + 20, 755), {size:9, align:"center", color:"#888888"});
  return doc.build(img, opts);
}

async function downloadInvoicePdf(mode){
  const forPrint = mode === "print";
  const t = (invoiceJob && invoiceJob.id === invoiceJobId) ? invoiceJob : trucks.find(x=>x.id===invoiceJobId);
  const hint = document.getElementById("printHint") || {};
  if(!t){ hint.textContent = "Couldn't find that job."; return; }
  hint.textContent = forPrint ? "Getting it ready to print…" : "Making the PDF…";
  let bytes;
  try{ bytes = await buildInvoicePdf(t, {autoPrint: forPrint}); }catch(e){ console.error(e); hint.textContent = "Couldn't build the PDF."; return; }
  const who = slugify(t.makeModel || t.vehicle || "");
  const filename = `Invoice-${invNum(t) || "draft"}${who ? "-" + who : ""}${forPrint ? "-print" : ""}.pdf`;
  const done = forPrint
    ? "Now open the file: the print window pops up by itself in Chrome or Adobe. In Mac Preview press ⌘P. On iPhone/iPad tap Share → Print."
    : "PDF saved — email it, text it, or keep it.";
  if(downloads){
    try{ await downloads.save({filename, data: bytes}); hint.textContent = done; return; }
    catch(e){
      if(e && e.code === "declined"){ hint.textContent = "Cancelled."; return; }
      if(e && e.code === "rate_limited"){ hint.textContent = "One moment — finish the other save first, then tap again."; return; }
    }
  }
  try{
    const url = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    hint.textContent = done;
  }catch(e){ hint.textContent = "Couldn't save the file on this device."; }
}

function jobPartsCost(t){ return t.partsCost ? Number(t.partsCost) : 0; }
function jobProfit(t){
  const sub = jobSubtotal(t);
  const tow = (t.towed && t.towCost) ? Number(t.towCost) : 0;
  return sub - tow - jobPartsCost(t);
}
function diagLine(t){
  if(!t.diagCharge || !t.diagFee) return "";
  const f = Number(t.diagFee);
  return t.diagWaived
    ? ` \u00b7 Diagnosis $${f.toFixed(2)} (waived)`
    : ` \u00b7 Diagnosis $${f.toFixed(2)}`;
}
function profitLine(t){
  if(!jobPartsCost(t)) return "";
  const p = jobProfit(t);
  const sub = jobSubtotal(t);
  const pct = sub ? (p/sub*100) : 0;
  return `<div style="font-size:.8rem;margin-top:3px;color:${p>=0?"var(--ready)":"#dc2626"};">Profit $${p.toFixed(2)} (${pct.toFixed(0)}%)</div>`;
}

function warrantyEnd(t){
  if(!t.warrantyMonths || !t.createdAt) return null;
  const d = new Date(t.createdAt);
  d.setMonth(d.getMonth() + Number(t.warrantyMonths));
  return d.getTime();
}
function warrantyDaysLeft(t){
  const e = warrantyEnd(t);
  if(e === null) return null;
  return Math.ceil((e - Date.now()) / 86400000);
}
function warrantyBadge(t){
  const left = warrantyDaysLeft(t);
  if(left === null) return "";
  if(left <= 0) return `<span class="badge" style="background:var(--received);margin-left:6px;">Warranty expired</span>`;
  const color = left <= 30 ? "#d97706" : "#0891b2";
  const txt = left > 60 ? Math.round(left/30) + " mo left" : left + "d left";
  return `<span class="badge" style="background:${color};margin-left:6px;">Warranty \u00b7 ${txt}</span>`;
}

// Any earlier job on this same vehicle still under warranty?
function warrantyAlert(t){
  const key = normVeh(t.vehicle);
  if(!key) return null;
  const prior = trucks.filter(x=>!x.deleted && x.id !== t.id && normVeh(x.vehicle) === key
    && (x.createdAt||0) < (t.createdAt||0) && warrantyDaysLeft(x) > 0);
  if(prior.length === 0) return null;
  const p = prior.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  return `<div style="margin-top:9px;background:rgba(217,119,6,.12);border:1px solid #d97706;border-radius:7px;padding:9px 11px;font-size:.82rem;">
    <strong style="color:#d97706;">\u26a0 Possible comeback</strong>
    <div style="margin-top:3px;">"${escapeHtml(p.issue||"")}" on ${fmtDate(p.createdAt)} is still under warranty (${warrantyDaysLeft(p)} days left).</div>
  </div>`;
}

function normVeh(v){ return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }

      ${(t.partsList||[]).length ? `<div class="meta" style="margin-top:3px;">Parts: ${t.partsList.filter(pp=>pp.name).map(pp=>escapeHtml(partLabel(pp))).join(", ")}</div>` : ""}

    </div>
    <div style="font-weight:700;font-size:.78rem;text-transform:uppercase;color:var(--muted);">Service history</div>
    ${rows}
  `);
}

function moneyPanel(dayOffset, mode){
  mode = mode || "day";
  const base = new Date(); base.setHours(0,0,0,0);
  let start, end, label;
  if(mode === "day"){
    const d = new Date(base); d.setDate(d.getDate() + dayOffset);
    start = d.getTime(); end = start + 86400000;
    label = dayOffset === 0 ? "Today" : dayOffset === -1 ? "Yesterday"
      : d.toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"});
  } else if(mode === "week"){
    const d = new Date(base); d.setDate(d.getDate() - d.getDay() + (dayOffset*7));
    start = d.getTime(); end = start + 7*86400000;
    const e = new Date(end - 86400000);
    label = (dayOffset===0?"This week":dayOffset===-1?"Last week":"Week of ") +
      " \u00b7 " + d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " \u2013 " + e.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  } else {
    const d = new Date(base.getFullYear(), base.getMonth() + dayOffset, 1);
    start = d.getTime();
    end = new Date(base.getFullYear(), base.getMonth() + dayOffset + 1, 1).getTime();
    label = d.toLocaleDateString(undefined,{month:"long", year:"numeric"});
  }

  const paidToday = trucks.filter(t=>!t.deleted && t.paid && Number(t.paid) > 0
    && (t.paidAt||t.createdAt||0) >= start && (t.paidAt||t.createdAt||0) < end);

  const byMethod = {};
  let total = 0;
  paidToday.forEach(t=>{
    const amt = Number(t.paid)||0;
    if(t.paidCash || t.paidCard){
      const c = Number(t.paidCash)||0, d = Number(t.paidCard)||0;
      if(c) byMethod["Cash"] = (byMethod["Cash"]||0) + c;
      if(d) byMethod["Card"] = (byMethod["Card"]||0) + d;
      const rest = amt - c - d;
      if(rest > 0.005) byMethod["Unspecified"] = (byMethod["Unspecified"]||0) + rest;
    } else {
      const m = t.paymentMethod || "Unspecified";
      byMethod[m] = (byMethod[m]||0) + amt;
    }
    total += amt;
  });

  const methodRows = Object.entries(byMethod).sort((a,b)=>b[1]-a[1]).map(([m,v])=>{
    const color = m === "Cash" ? "var(--ready)" : m === "Card" ? "var(--accent)" : "var(--muted)";
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--border);">
      <span style="display:flex;align-items:center;gap:8px;"><span style="width:9px;height:9px;border-radius:50%;background:${color};"></span>${escapeHtml(m)}</span>
      <strong>$${v.toFixed(2)}</strong></div>`;
  }).join("") || `<div style="color:var(--muted);padding:10px 0;">No payments recorded.</div>`;

  const jobRows = paidToday.map(t=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:.85rem;">
    <div style="flex:1;min-width:0;">
      <div style="font-weight:600;">${escapeHtml(t.vehicle)}</div>
      <div class="meta">${escapeHtml(t.customer||"")}${payMethodText(t)?" \u00b7 "+escapeHtml(payMethodText(t)):""}</div>
    </div>
    <div style="font-weight:700;white-space:nowrap;">$${Number(t.paid).toFixed(2)}</div>
  </div>`).join("");

  const outstanding = trucks.filter(t=>!t.deleted && !t.archived).reduce((n,t)=>n+Math.max(0,jobBalance(t)),0);

  openPanel(`
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;">
      ${["day","week","month"].map(m=>`<button type="button" data-mode="${m}" style="padding:8px;font-size:.8rem;font-weight:600;border-radius:7px;border:1px solid ${mode===m?"var(--accent)":"var(--border)"};background:${mode===m?"var(--accent)":"var(--card)"};color:${mode===m?"#fff":"var(--text)"};">${m==="day"?"Day":m==="week"?"Week":"Month"}</button>`).join("")}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <div style="font-weight:700;font-size:1.05rem;">${label}</div>
      <div style="display:flex;gap:6px;">
        <button type="button" class="btn-edit" id="prevDayBtn" style="padding:5px 10px;font-size:.78rem;">&#8592;</button>
        <button type="button" class="btn-edit" id="nextDayBtn" style="padding:5px 10px;font-size:.78rem;${dayOffset>=0?"opacity:.4;":""}">&#8594;</button>
      </div>
    </div>
    <div style="font-size:2rem;font-weight:700;margin:10px 0 4px;">$${total.toFixed(2)}</div>
    <div style="color:var(--muted);font-size:.82rem;margin-bottom:16px;">${paidToday.length} payment${paidToday.length===1?"":"s"} taken in</div>

    <div style="font-weight:700;font-size:.78rem;text-transform:uppercase;color:var(--muted);margin-bottom:2px;">By method</div>
    ${methodRows}

    ${jobRows ? `<div style="font-weight:700;font-size:.78rem;text-transform:uppercase;color:var(--muted);margin:16px 0 2px;">Payments</div>${jobRows}` : ""}

    <div style="background:var(--bg);border-radius:8px;padding:11px;margin-top:16px;display:flex;justify-content:space-between;">
      <span style="color:var(--muted);font-size:.85rem;">Still owed (all open jobs)</span>
      <strong style="color:#dc2626;">$${outstanding.toFixed(2)}</strong>
    </div>
  `);
  document.getElementById("prevDayBtn").addEventListener("click", ()=>moneyPanel(dayOffset-1, mode));
  document.getElementById("nextDayBtn").addEventListener("click", ()=>{ if(dayOffset < 0) moneyPanel(dayOffset+1, mode); });
  document.querySelectorAll("[data-mode]").forEach(b=>{
    b.addEventListener("click", ()=>moneyPanel(0, b.getAttribute("data-mode")));
  });
}

document.getElementById("cashBtn").addEventListener("click", ()=>moneyPanel(0,"day"));

function buildCustomerList(){
  const map = {};
  trucks.filter(t=>!t.deleted).forEach(t=>{
    const key = normPhone(t.phone);
    if(!key || key.length < 7) return;
    if(!map[key]) map[key] = {phone: t.phone, name: t.customer||"", visits: 0, spent: 0, last: 0, vehicles: new Set()};
    const c = map[key];
    c.visits++;
    c.spent += jobTotal(t);
    if((t.createdAt||0) > c.last){ c.last = t.createdAt||0; c.name = t.customer || c.name; c.phone = t.phone; }
    if(t.vehicle) c.vehicles.add(t.vehicle);
  });
  return Object.values(map).sort((a,b)=> b.last - a.last);
}

      <div style="display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;">

        <button type="button" class="btn-edit" id="copyAllBtn" style="padding:6px 11px;font-size:.78rem;">Copy all numbers</button>
      </div>
      <div id="offerStatus" style="font-size:.78rem;color:var(--muted);margin-top:7px;"></div>
    </div>

    ${rows}
    <button type="button" class="btn-primary" id="exportCustomersBtn" style="margin-top:16px;width:100%;">&#11015; Export customer list (CSV)</button>
  `);

  const status = document.getElementById("offerStatus");
  function copy(text, msg){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); status.textContent = msg; }
    catch(e){ status.textContent = "Couldn't copy — select the text manually."; }
    ta.remove();
  }
  document.getElementById("copyOfferBtn").addEventListener("click", ()=>{
    copy(document.getElementById("offerText").value, "Message copied \u2713");
  });
  document.getElementById("copyDueBtn").addEventListener("click", ()=>{
    const list = cs.filter(c=> Math.floor((now-c.last)/86400000) >= 90).map(c=>c.phone);
    copy(list.join(", "), list.length ? `${list.length} number${list.length===1?"":"s"} copied \u2713` : "No customers past 90 days.");
  });
  document.getElementById("copyAllBtn").addEventListener("click", ()=>{
    const list = cs.map(c=>c.phone);
    copy(list.join(", "), `${list.length} number${list.length===1?"":"s"} copied \u2713`);

  document.getElementById("exportCustomersBtn").addEventListener("click", async ()=>{

    const data = cs.map(c=>[
      c.name, c.phone, c.visits, c.spent.toFixed(2),
      new Date(c.last).toLocaleDateString(), Math.floor((now-c.last)/86400000),

document.getElementById("reportsBtn").addEventListener("click", ()=>{

    <div style="font-weight:700;font-size:1.05rem;margin-bottom:14px;">Reports</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px;">

      const withCost = live.filter(t=>jobPartsCost(t) > 0);
      if(!withCost.length) return `<div style="font-size:.82rem;color:var(--muted);margin-bottom:16px;">Enter "Parts Cost to You" on jobs to see profit margin.</div>`;

        <div style="display:flex;justify-content:space-between;"><span>Revenue (${withCost.length} job${withCost.length===1?"":"s"})</span><strong>$${rev.toFixed(2)}</strong></div>
        <div style="display:flex;justify-content:space-between;color:var(--muted);"><span>Parts cost to you</span><span>-$${cost.toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);margin-top:6px;padding-top:6px;">
          <strong>Profit</strong><strong style="color:${prof>=0?"var(--ready)":"#dc2626"};">$${prof.toFixed(2)} (${pct.toFixed(0)}%)</strong></div>
      </div>`;
    })()}
    <div style="font-weight:700;font-size:.8rem;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">Quoted vs actual labor</div>
    <div style="font-size:.88rem;margin-bottom:16px;">${hoursLine}</div>
    <div style="font-weight:700;font-size:.8rem;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">Parts spend by store</div>
    ${storeRows}
    <button type="button" class="btn-primary" id="backupBtn" style="margin-top:16px;width:100%;">&#11015; Backup all records (CSV)</button>
  `);
  document.getElementById("backupBtn").addEventListener("click", ()=>{
    document.getElementById("exportBtn").click();
  });
});

    <div style="font-size:.86rem;color:#555;margin-bottom:14px;">${escapeHtml(t.customer||"")}${t.phone?` \u00b7 ${escapeHtml(fmtPhoneDash(t.phone))}`:""}</div>

    ${t.complaint ? `<div style="background:#f4f4f4;border-radius:6px;padding:11px;margin-bottom:14px;">
      <div style="font-size:.72rem;text-transform:uppercase;font-weight:700;color:#777;margin-bottom:3px;">Customer complaint</div>
      <div style="font-size:.92rem;">"${escapeHtml(t.complaint)}"</div>
      ${(t.diagCharge && t.diagFee)?`<div style="font-size:.82rem;color:#b45309;margin-top:6px;font-weight:600;">Diagnosis charge: $${Number(t.diagFee).toFixed(2)}${t.diagWaived?" (waived if repair approved)":""}</div>`:""}
    </div>` : ""}

    <div style="font-size:.78rem;text-transform:uppercase;font-weight:700;color:#777;margin-bottom:2px;">Authorized work</div>
    ${tasks}

    <div style="font-size:.78rem;text-transform:uppercase;font-weight:700;color:#777;margin:16px 0 2px;">Parts</div>

    ${declined.length ? `<div style="margin-top:16px;background:#fdf0f0;border:1px solid #e88;border-radius:6px;padding:11px;">
      <div style="font-size:.78rem;text-transform:uppercase;font-weight:700;color:#a33;margin-bottom:4px;">DO NOT PERFORM \u2014 declined</div>
      ${declined.map(w=>`<div style="font-size:.86rem;">${escapeHtml(w.desc||"")}</div>`).join("")}

document.getElementById("closeInvoiceBtn").addEventListener("click", ()=>hideOverlay("invoiceOverlay"));

  if(b) b.innerHTML = kind === "invoice" ? "&#128424; Print" : "&#128424; Print (saves a printable page)";
  const pb = document.getElementById("topPdfBtn"); if(pb) pb.style.display = kind === "invoice" ? "" : "none";

document.getElementById("topPdfBtn").addEventListener("click", ()=>{ if(currentDoc.kind === "invoice") downloadInvoicePdf("save"); });
document.getElementById("topCloseBtn").addEventListener("click", ()=>document.getElementById("closeInvoiceBtn").click());
new MutationObserver(()=>{
  const a = document.getElementById("printHint"), b = document.getElementById("topPrintHint");
  if(a && b && b.textContent !== a.textContent) b.textContent = a.textContent;
}).observe(document.getElementById("printHint"), {childList:true, characterData:true, subtree:true});

function slugify(v){
  return String(v||"doc").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "doc";
}

function standalonePrintDoc(){
  const title = (currentDoc.kind === "workorder" ? "Work Order" : "Invoice") +
    (currentDoc.vehicle ? " \u2014 " + currentDoc.vehicle : "");
  const body = document.getElementById("invoiceContent").innerHTML;
  return `<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escapeHtml(title)}</title>
<style>
@page{margin:14mm;}
body{margin:0;padding:24px;background:#fff;color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.sheet{max-width:680px;margin:0 auto;}
table{width:100%;border-collapse:collapse;}
img{max-width:100%;}
.bar{max-width:680px;margin:0 auto 18px;display:flex;gap:10px;}
.bar button{flex:1;padding:12px;font-size:15px;font-weight:600;cursor:pointer;
  border:1px solid #333;border-radius:7px;background:#111;color:#fff;}
@media print{.bar{display:none !important;}body{padding:0;}}
</style></head>
<body>
<div class="bar"><button onclick="window.print()">Print / Save as PDF</button></div>
<div class="sheet">${body}</div>
</body></html>`;
}

document.getElementById("saveInvoiceBtn").addEventListener("click", async ()=>{
  const html = standalonePrintDoc();
  const filename = (currentDoc.kind === "workorder" ? "workorder-" : "invoice-") +
    slugify(currentDoc.vehicle) + ".html";
  const hint = document.getElementById("printHint");
  if(downloads){
    try{
      await downloads.save({filename, data: html});
      hint.textContent = "Saved. Open it on your Mac and press \u2318P to print.";
      return;
    }catch(e){
      if(e && e.code === "cancelled"){ return; }
    }
  }
  try{
    const blob = new Blob([html], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    hint.textContent = "Saved. Open it on your Mac and press \u2318P to print.";
  }catch(e){
    hint.textContent = "Couldn't save the file here. Try the Print button.";
  }
});
document.getElementById("invoiceOverlay").addEventListener("click", (e)=>{

});

// Esc closes whatever is open on the right
document.addEventListener("keydown", (e)=>{
  if(e.key !== "Escape") return;
  if(document.getElementById("invoiceOverlay").style.display === "block"){ hideOverlay("invoiceOverlay"); return; }
  if(document.getElementById("panelOverlay").style.display === "block"){ hideOverlay("panelOverlay"); return; }

});

async function addTruck(data){
  const id = "t" + Date.now() + Math.random().toString(36).slice(2,7);
  if(!(data.invSeries === 3 && data.invoiceNum)){ data = {...data, invoiceNum: allocInvoiceNumber(), invSeries: 3}; }
  _invPending.add(id);
  markMine(id);
  const doc = {...data, id, status: data.status || "received", archived:false, createdAt: Date.now()};
  if(db){
    try{ await db.doc("trucks/"+id).set(doc); }catch(err){ console.error(err); }
  } else {
    trucks.push(doc);
    render();
  }
}

async function updateTruck(id, patch){
  markMine(id);
  if(db){
    try{ await db.doc("trucks/"+id).update(patch); }catch(err){ console.error(err); }
  } else {
    const t = trucks.find(x=>x.id===id);
    if(t) Object.assign(t, patch);
    checkStatusChanges(trucks);
    render();
  }
}

async function deleteTruck(id){
  markMine(id);
  if(db){
    try{ await db.doc("trucks/"+id).delete(); }catch(err){ console.error(err); }
  } else {
    trucks = trucks.filter(x=>x.id!==id);
    render();
  }
}

document.getElementById("addForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const data = {
    vehicle: document.getElementById("f-vehicle").value.trim(),
    plateState: document.getElementById("f-plateState").value || "",
    makeModel: document.getElementById("f-makeModel").value.trim(),
    vin: (document.getElementById("f-vin").value.trim().toUpperCase() || vinFromJob({vehicle: document.getElementById("f-vehicle").value}) || ""),
    photo: photoData,
    gallery: galleryPhotos.slice(),
    customer: document.getElementById("f-customer").value.trim(),
    phone: document.getElementById("f-phone").value.trim(),
    issue: document.getElementById("f-issue").value.trim(),
    complaint: document.getElementById("f-complaint").value.trim(),
    warrantyMonths: document.getElementById("f-warrantyMonths").value || null,
    scheduled: document.getElementById("f-scheduled").value || null,
    scheduledTime: document.getElementById("f-scheduledTime").value || null,
    diagCharge: document.getElementById("f-hasDiag").checked,
    diagFee: document.getElementById("f-hasDiag").checked ? (document.getElementById("f-diagFee").value || null) : null,
    diagWaived: document.getElementById("f-hasDiag").checked ? document.getElementById("f-diagWaived").checked : false,
    itemizeWork: document.getElementById("f-itemizeWork").checked,
    workList: document.getElementById("f-itemizeWork").checked ? workList.filter(w=>w.desc||w.hours||w.parts) : [],
    partsList: partsList.filter(p=>p.name||p.store||p.price),
    noTax: !document.getElementById("f-chargeTax").checked,
    extraItems: formExtras.filter(x=>(x.name||"").trim() || parseFloat(x.price)).map(x=>({name:(x.name||"").trim(), desc:x.desc||"", qty:parseFloat(x.qty)||1, price:parseFloat(x.price)||0})),
    estimate: String(partsListTotal(partsList.filter(p=>p.name||p.store||p.price))),
    partsSaved: true,
    laborHours: document.getElementById("f-laborHours").value || null,
    jobType: document.getElementById("f-jobType").value,
    partsSource: currentPartsSource(),
    towed: document.getElementById("f-towed").checked,
    towCost: document.getElementById("f-towed").checked ? (document.getElementById("f-towCost").value || null) : null,
    pickupLocation: document.getElementById("f-towed").checked ? document.getElementById("f-pickupLocation").value.trim() : "",
    towMiles: document.getElementById("f-towed").checked ? (document.getElementById("f-towMiles").value || null) : null,
    milesEstimated: document.getElementById("f-towed").checked ? !!milesEstimated : false,
    paid: document.getElementById("f-paid").value || null,
    paymentMethod: document.getElementById("f-paymentMethod").value || "",
    cardFee: feeOn(),
    paidCash: payMode() === "Split" ? (document.getElementById("f-payCashAmt").value || "0") : null,
    paidCard: payMode() === "Split" ? (document.getElementById("f-payCardAmt").value || "0") : null,
    paidAt: (document.getElementById("f-paid").value && !document.getElementById("f-paid").dataset.wasPaid) ? Date.now() : undefined,
    paymentStatus: document.getElementById("f-paymentStatus").value,
    notes: document.getElementById("f-notes").value.trim()
  };
  if(data.paidAt === undefined) delete data.paidAt;
  if(!data.vehicle && !data.makeModel){
    showToast("Enter the plate or the make/model before saving");
    const v = document.getElementById("f-vehicle"); if(v) v.focus();
    return;
  }
  if(!data.vehicle) data.vehicle = "\u2014";
  if(editingId){
    await updateTruck(editingId, data);
  } else {
    await addTruck(data);
  }
  resetForm();
  closeForm();
});

setInterval(()=>{
  if(!trucks.some(t=>t.timerStart)) return;
  document.querySelectorAll("[data-timer]").forEach(btn=>{
    const t = trucks.find(x=>x.id===btn.getAttribute("data-timer"));
    if(!t || !t.timerStart) return;
    const span = btn.parentElement.querySelector("span[style*='monospace']");
    if(span) span.textContent = fmtDuration(actualSeconds(t));
  });
}, 1000);

(async function init(){
  try{
    const viewer = await claude.use("user");
    if(viewer){
      try{ if(await viewer.isOwner()) document.body.classList.add("is-owner"); }catch(e){}
      const mayWrite = await viewer.can("data.write");
      // null = platform said nothing: keep controls, a refused write decides.
      if(mayWrite === false) document.body.classList.add("readonly");
    }
  }catch(e){ /* full access by default */ }

  try{ db = await claude.use("db"); }catch(e){ db = null; }
  try{ downloads = await claude.use("downloads"); }catch(e){ downloads = null; }
  try{
    sampleFn = await claude.use("sample");
    if(sampleFn){
      const lim = await sampleFn.limits().catch(()=>null);
      sampleImagesOK = !!(lim && lim.images);
    }
  }catch(e){ sampleFn = null; }
  wireScanButton();
  if(!sampleFn || !sampleImagesOK){
    const sb = document.getElementById("scanPlateBtn");
    if(sb) sb.style.display = "none";
  }

  if(db){
    try{
      db.collection("trucks").onSnapshot((snap)=>{
        trucks = snap.docs ? snap.docs.map(d=>d.data ? d.data() : d) : (snap || []);
        checkStatusChanges(trucks);
        render();
        backfillInvoiceNumbers();
      });
    }catch(err){
      console.error(err);
      render();
    }
  } else {
    render();
    backfillInvoiceNumbers();
  }
})();
</script>
